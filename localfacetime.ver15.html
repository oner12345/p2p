<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FaceTime Web - P2P Serverless Connect</title>
  <style>
    /* 原生響應式 CSS 樣式表 - 替代 Tailwind 以支援完全離線 */
    :root {
      --sat: env(safe-area-inset-top);
      --sab: env(safe-area-inset-bottom);
      --apple-green: #30D158;
      --apple-red: #FF453A;
      --apple-dark: #1C1C1E;
      --apple-gray: #2C2C2E;
      --apple-light-gray: #3A3A3C;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      height: 100%;
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overscroll-behavior: none;
    }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .hidden { display: none !important; }
    .fixed { position: fixed; }
    .absolute { position: absolute; }
    .inset-0 { top: 0; left: 0; right: 0; bottom: 0; }
    .z-0 { z-index: 0; }
    .z-10 { z-index: 10; }
    .z-20 { z-index: 20; }
    .z-30 { z-index: 30; }
    .z-50 { z-index: 50; }
    .z-100 { z-index: 100; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .object-cover { object-fit: cover; }
    .blur-bg {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .mirror-view { transform: scaleX(-1); }
    
    /* 設置面板排版 */
    #setup-panel {
      background-color: rgba(0, 0, 0, 0.85);
      padding: 24px;
      overflow-y: auto;
    }
    .panel-container {
      width: 100%;
      max-width: 420px;
      margin: auto;
    }
    .app-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .logo-box {
      width: 36px;
      height: 36px;
      background-color: var(--apple-green);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(48, 209, 88, 0.3);
    }
    .logo-text {
      font-size: 1.125rem;
      font-weight: 600;
      margin-left: 8px;
    }
    .badge {
      background-color: rgba(48, 209, 88, 0.2);
      color: var(--apple-green);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 700;
      margin-left: 4px;
    }
    
    /* 按鈕與控制項 */
    .apple-btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .apple-btn:active { transform: scale(0.98); }
    .btn-green { background-color: var(--apple-green); color: #000000; }
    .btn-green:hover { background-color: #2bc050; }
    .btn-gray { background-color: var(--apple-light-gray); color: #ffffff; }
    .btn-gray:hover { background-color: #4a4a4c; }
    .btn-red { background-color: var(--apple-red); color: #ffffff; }
    
    /* 網段選擇卡片 */
    .card {
      background-color: var(--apple-gray);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 16px;
    }
    .text-muted { color: #a1a1a6; font-size: 0.75rem; line-height: 1.4; }
    
    /* 二維碼掃描配對專用彈窗（z-100） */
    #qr-pairing-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: #000000;
      display: none;
      flex-direction: column;
      height: 100dvh;
    }
    .scan-half {
      flex: 1;
      position: relative;
      background-color: #050505;
      overflow: hidden;
      border-bottom: 2px solid var(--apple-light-gray);
    }
    .qr-half {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      padding: 16px;
      gap: 12px;
    }
    .qr-container {
      width: 180px;
      height: 180px;
      background-color: #ffffff;
      padding: 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #reader {
      width: 100%;
      height: 100%;
    }
    .scan-target-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border: 2px solid var(--apple-green);
      border-radius: 16px;
      box-shadow: 0 0 0 4000px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    .pairing-progress {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--apple-green);
      text-align: center;
    }
    
    /* 本地子畫面 */
    #local-video-container {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 110px;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
    }
    
    /* 通話進行中控制列 */
    #call-overlay {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 24px;
      padding-bottom: max(1.5rem, var(--sab));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .control-bar {
      background-color: rgba(30, 30, 32, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 16px;
      border-radius: 32px;
      display: flex;
      gap: 16px;
      pointer-events: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    .round-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--apple-light-gray);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      transition: background-color 0.2s;
    }
    .round-btn-red { background-color: var(--apple-red); }
    .round-btn-red:hover { background-color: #ff3b30; }
  </style>

  <!-- 3. html5-qrcode.min.js (高壓縮本地攝像頭解碼庫) -->
  <script src="https://unpkg.com/html5-qrcode" crossorigin="anonymous"></script>
</head>
<body class="flex flex-col justify-between">

  <!-- Toast 訊息容器 -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[110] w-11/12 max-w-sm pointer-events-none"></div>

  <!-- 背景遠端影片區 -->
  <div class="fixed inset-0 z-0 bg-black w-full h-full">
    <video id="remote-video" class="w-full h-full object-cover" autoplay playsinline></video>
    <div id="video-placeholder" class="fixed inset-0 flex flex-col items-center justify-center bg-zinc-950 text-zinc-500 transition-opacity duration-500 z-[1]">
      <span class="text-sm font-medium">等待影片串流...</span>
    </div>
  </div>

  <!-- 浮動本地影片預覽 -->
  <div id="local-video-container" class="z-30">
    <video id="local-video" class="w-full h-full object-cover mirror-view" autoplay playsinline muted></video>
  </div>

  <!-- ================= 主設置面板 ================= -->
  <div id="setup-panel" class="fixed inset-0 z-20 flex flex-col justify-between">
    <div class="panel-container">
      
      <!-- 標題 -->
      <div class="app-title-bar">
        <div class="flex items-center">
          <div class="logo-box">
            <svg class="w-5 h-5 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          </div>
          <span class="logo-text">FaceTime <span class="badge">無網二維碼版</span></span>
        </div>
      </div>

      <!-- 操作卡片 -->
      <div class="card flex flex-col gap-4">
        <p class="text-muted">本模式 100% 離線運作。雙方處於同一個 Wi-Fi 網絡下，點擊下方按鈕，同時互掃生成的二維碼即可接通。</p>
        
        <!-- 角色選擇 -->
        <div class="flex gap-2">
          <button id="btn-caller" onclick="startPairingFlow('caller')" class="apple-btn btn-gray flex-1">我是發起方</button>
          <button id="btn-receiver" onclick="startPairingFlow('receiver')" class="apple-btn btn-gray flex-1">我是接聽方</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= 二維碼雙向對接彈窗 (z-100) ================= -->
  <div id="qr-pairing-modal">
    <!-- 上半部：鏡頭掃描 -->
    <div class="scan-half">
      <div id="reader"></div>
      <div class="scan-target-box"></div>
    </div>
    
    <!-- 下半部：本機動態二維碼 -->
    <div class="qr-half">
      <div class="pairing-progress" id="pairing-status">正在生成本地代碼...</div>
      <div class="qr-container" id="qr-target"></div>
      <button onclick="abortPairing()" class="apple-btn btn-red" style="max-width: 180px;">取消配對</button>
    </div>
  </div>

  <!-- ================= 通話控制列 ================= -->
  <div id="call-overlay">
    <div class="control-bar">
      <button onclick="toggleMic()" class="round-btn" id="btn-mic">🎙️</button>
      <button onclick="toggleVideo()" class="round-btn" id="btn-video">📹</button>
      <button onclick="endCall()" class="round-btn round-btn-red">📞</button>
    </div>
  </div>

  <!-- ================= 核心對接邏輯 ================= -->
  <script>
    let peerConnection = null;
    let localStream = null;
    let remoteStream = null;
    let activeRole = null;
    let qrcodeGen = null;
    let html5QrcodeScanner = null;
    
    // 二維碼輪播變數
    let qrCarouselInterval = null;
    let currentQrIndex = 0;
    let myChunks = [];

    // 接收緩衝區
    let receivedChunks = {};
    let totalChunksNeeded = 0;

    const rtcConfig = { iceServers: [] }; // 完全離線局域網模式，不依賴外網 STUN

    document.addEventListener("DOMContentLoaded", () => {
      // 初始化自適應版本嘅標準 QRCode 實例 (使用 L 級容錯率最大化容量，減少圖案複雜度)
      qrcodeGen = new QRCode("qr-target", { 
        width: 160, 
        height: 160,
        correctLevel: QRCode.CorrectLevel.L
      });
    });

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.style.cssText = "background: rgba(30,30,30,0.95); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; margin-bottom: 8px; font-size: 13px; text-align: center;";
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    async function startPairingFlow(role) {
      activeRole = role;
      document.getElementById('qr-pairing-modal').style.display = 'flex';
      
      // 1. 喚醒並載入本機鏡頭預覽
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
        document.getElementById('local-video').srcObject = localStream;
      } catch (err) {
        showToast("相機啟動失敗: " + err.message);
        abortPairing();
        return;
      }

      // 2. 初始化 WebRTC Connection
      initPeerConnection();

      // 3. 根據角色生成 SDP
      if (role === 'caller') {
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        prepareAndCarouselSDP(peerConnection.localDescription.sdp);
      } else {
        document.getElementById('pairing-status').innerText = "請先對準發起方的二維碼進行掃描...";
      }

      // 4. 開啟高頻掃描解析
      startCameraScanner();
    }

    function initPeerConnection() {
      if (peerConnection) peerConnection.close();
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteStream = event.streams[0];
          document.getElementById('remote-video').srcObject = remoteStream;
          transitionToCallActive();
        }
      };

      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }
    }

    // 將 SDP 壓縮、分段並啟動二維碼輪播
    function prepareAndCarouselSDP(sdp) {
      clearInterval(qrCarouselInterval);
      
      // Pako Deflate 壓縮及 Base64 轉換
      const compressed = pako.deflate(sdp);
      const binaryString = Array.from(compressed).map(b => String.fromCharCode(b)).join('');
      const base64Data = btoa(binaryString);

      // 分段 (每段設為 120 字元，配合自動版本檢測，能有效降低二維碼點陣密度)
      const chunkSize = 120;
      myChunks = [];
      const total = Math.ceil(base64Data.length / chunkSize);
      for (let i = 0; i < total; i++) {
        myChunks.push(`${i+1}/${total}_${base64Data.substr(i * chunkSize, chunkSize)}`);
      }

      // 啟動 Carousel 動態輪播
      currentQrIndex = 0;
      qrCarouselInterval = setInterval(() => {
        if (myChunks.length === 0) return;
        try {
          qrcodeGen.makeCode(myChunks[currentQrIndex]);
          document.getElementById('pairing-status').innerText = `本地代碼傳輸中 (${currentQrIndex+1}/${myChunks.length})`;
          currentQrIndex = (currentQrIndex + 1) % myChunks.length;
        } catch (e) {
          console.error("QRCode 生成出錯: ", e);
        }
      }, 250);
    }

    // 啟動攝像頭流式解碼
    function startCameraScanner() {
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: 250 },
        onQrCodeScanned,
        () => {} // 忽略掃描未命中幀
      ).catch(err => {
        showToast("掃描器初始化失敗: " + err);
      });
    }

    // 接收與流式拼接二維碼數據
    async function onQrCodeScanned(decodedText) {
      const match = decodedText.match(/^(\d+)\/(\d+)_(.+)$/);
      if (!match) return;

      const idx = parseInt(match[1]);
      const total = parseInt(match[2]);
      const payload = match[3];

      if (totalChunksNeeded === 0) {
        totalChunksNeeded = total;
      }

      if (!receivedChunks[idx]) {
        receivedChunks[idx] = payload;
        const currentCount = Object.keys(receivedChunks).length;
        showToast(`已接收對方分段: ${currentCount}/${total}`);

        if (currentCount === totalChunksNeeded) {
          // 完成收集，暫停掃描並執行還原
          await html5QrcodeScanner.stop();
          reconstructAndApplySDP();
        }
      }
    }

    // 重組 SDP 文本並注入 WebRTC
    async function reconstructAndApplySDP() {
      try {
        let base64String = "";
        for (let i = 1; i <= totalChunksNeeded; i++) {
          base64String += receivedChunks[i];
        }

        // 解碼、解壓
        const binaryString = atob(base64String);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        const decompressedSdp = pako.inflate(bytes, { to: 'string' });

        if (activeRole === 'caller') {
          // 發起方：設置接聽方的 Answer 進入通道
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: decompressedSdp }));
          showToast("雙向握手對接完成，正在建立通話通道...");
        } else {
          // 接聽方：設置發起方的 Offer -> 建立 Answer -> 回傳 Answer 的輪播
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: decompressedSdp }));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          
          // 重置接收緩衝，等候發起方通道建立
          receivedChunks = {};
          totalChunksNeeded = 0;
          
          // 啟動本機 Answer 二維碼輪播供發起方掃描
          prepareAndCarouselSDP(peerConnection.localDescription.sdp);
          showToast("已成功解析發起方代碼！請讓發起方掃描下方生成的 Answer 代碼...");
        }
      } catch (err) {
        showToast("代碼還原出錯，請重新進行掃描對焦。");
        abortPairing();
      }
    }

    function transitionToCallActive() {
      // 關閉並清理所有配對視窗與計時器
      abortPairing(false);
      
      document.getElementById('setup-panel').style.display = 'none';
      document.getElementById('local-video-container').style.display = 'block';
      document.getElementById('call-overlay').style.transform = 'translateY(0)';
    }

    function abortPairing(stopStream = true) {
      clearInterval(qrCarouselInterval);
      qrCarouselInterval = null;
      receivedChunks = {};
      totalChunksNeeded = 0;

      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().catch(() => {});
        html5QrcodeScanner = null;
      }

      document.getElementById('qr-pairing-modal').style.display = 'none';

      if (stopStream && localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
    }

    function endCall() {
      location.reload();
    }

    function toggleMic() {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        audioTrack.enabled = !audioTrack.enabled;
        document.getElementById('btn-mic').innerText = audioTrack.enabled ? "🎙️" : "🔇";
      }
    }

    function toggleVideo() {
      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        videoTrack.enabled = !videoTrack.enabled;
        document.getElementById('btn-video').innerText = videoTrack.enabled ? "📹" : "🚫";
      }
    }
  </script>
</body>
</html>
