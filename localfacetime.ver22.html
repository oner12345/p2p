<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <style>
    /* 原生 Apple 風格響應式 CSS 樣式表 - 100% 離線可用 */
    :root {
      --sat: env(safe-area-inset-top);
      --sab: env(safe-area-inset-bottom);
      --apple-green: #30D158;
      --apple-red: #FF453A;
      --apple-dark: #1C1C1E;
      --apple-gray: #2C2C2E;
      --apple-light-gray: #3A3A3C;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      height: 100%;
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overscroll-behavior: none;
    }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .hidden { display: none !important; }
    .fixed { position: fixed; }
    .absolute { position: absolute; }
    .inset-0 { top: 0; left: 0; right: 0; bottom: 0; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .object-cover { object-fit: cover; }
    .blur-bg {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .mirror-view { transform: scaleX(-1); }
    
    /* 主面板 */
    #setup-panel {
      background-color: rgba(0, 0, 0, 0.85);
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      height: 100dvh;
      z-index: 20;
    }
    .panel-container {
      width: 100%;
      max-width: 420px;
      margin: auto;
    }
    .app-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .logo-box {
      width: 40px;
      height: 40px;
      background-color: var(--apple-green);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(48, 209, 88, 0.4);
    }
    .logo-text {
      font-size: 1.25rem;
      font-weight: 600;
      margin-left: 10px;
    }
    .badge {
      background-color: rgba(48, 209, 88, 0.2);
      color: var(--apple-green);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 700;
      margin-left: 6px;
    }
    
    /* 按鈕 */
    .apple-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .apple-btn:active { transform: scale(0.97); }
    .btn-green { background-color: var(--apple-green); color: #000000; }
    .btn-green:hover { background-color: #2bc050; }
    .btn-gray { background-color: var(--apple-light-gray); color: #ffffff; }
    .btn-gray:hover { background-color: #4a4a4c; }
    .btn-red { background-color: var(--apple-red); color: #ffffff; }

      background-color: var(--apple-gray);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 16px;
    }
    .text-muted { color: #a1a1a6; font-size: 0.85rem; line-height: 1.5; text-align: center; }

    #qr-pairing-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: #000000;
      display: none;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    .scan-half {
      flex: 1.1;
      position: relative;
      background-color: #050505;
      overflow: hidden;
      border-bottom: 2px solid var(--apple-light-gray);
    }
    .qr-half {
      flex: 0.9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      padding: 16px;
      gap: 16px;
    }

    @media (min-width: 768px) and (orientation: landscape) {
      #qr-pairing-modal {
        flex-direction: row;
      }
      .scan-half {
        flex: 1;
        border-bottom: none;
        border-right: 2px solid var(--apple-light-gray);
      }
      .qr-half {
        flex: 1;
      }

      width: 190px;
      height: 190px;
      background-color: #ffffff;
      padding: 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);

      height: 100%;

      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border: 3px solid var(--apple-green);
      border-radius: 24px;
      box-shadow: 0 0 0 4000px rgba(0,0,0,0.65);
      pointer-events: none;

    .pairing-progress {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--apple-green);
      text-align: center;
      letter-spacing: 0.5px;

      top: 16px;
      right: 16px;
      width: 110px;
      height: 165px;
      border-radius: 18px;

      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: none;
      z-index: 30;

      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 24px;
      padding-bottom: max(2rem, var(--sab));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transform: translateY(100%);

      pointer-events: none;
      z-index: 30;

    .control-bar {
      background-color: rgba(30, 30, 32, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 16px 24px;
      border-radius: 40px;
      display: flex;
      gap: 20px;
      pointer-events: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);

    .round-btn {

    .round-btn-red { background-color: var(--apple-red); }
    .round-btn-red:hover { background-color: #ff3b30; }

  <!-- ================= INLINE DEPENDENCIES (完全獨立，排除命名衝突) ================= -->
  <script>
    const QRMode = {
      MODE_8BIT_BYTE: 4
    };

    const QRErrorCorrectLevel = {
      L: 1,
      M: 0,
      Q: 3,
      H: 2
    };

    class QR8bitByte {
      constructor(data) {
        this.mode = QRMode.MODE_8BIT_BYTE;
        this.data = data;
        this.parsedData = [];
        for (let i = 0; i < this.data.length; i++) {
          const byteArray = [];
          const code = this.data.charCodeAt(i);
          if (code > 0x10000) {
            byteArray[0] = 0xf0 | ((code >>> 18) & 0x07);
            byteArray[1] = 0x80 | ((code >>> 12) & 0x3f);
            byteArray[2] = 0x80 | ((code >>> 6) & 0x3f);
            byteArray[3] = 0x80 | (code & 0x3f);
          } else if (code > 0x800) {
            byteArray[0] = 0xe0 | ((code >>> 12) & 0x0f);
            byteArray[1] = 0x80 | ((code >>> 6) & 0x3f);
            byteArray[2] = 0x80 | (code & 0x3f);
          } else if (code > 0x80) {
            byteArray[0] = 0xc0 | ((code >>> 6) & 0x1f);
            byteArray[1] = 0x80 | (code & 0x3f);
          } else {
            byteArray[0] = code;
          }
          this.parsedData.push(...byteArray);
        }
      }
      getLength() { return this.parsedData.length; }
      write(buffer) {
        for (let i = 0; i < this.parsedData.length; i++) {
          buffer.put(this.parsedData[i], 8);
        }
      }
    }

    class QRBitBuffer {
      constructor() { this.buffer = []; this.length = 0; }
      get(index) {
        const bufIndex = Math.floor(index / 8);
        return ((this.buffer[bufIndex] >>> (7 - index % 8)) & 1) == 1;
      }
      put(num, length) {
        for (let i = 0; i < length; i++) {
          this.putBit(((num >>> (length - i - 1)) & 1) == 1);
        }
      }
      getLengthInBits() { return this.length; }
      putBit(bit) {
        const bufIndex = Math.floor(this.length / 8);
        if (this.buffer.length <= bufIndex) {
          this.buffer.push(0);
        }
        if (bit) {
          this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
        }
        this.length++;
      }
    }

    class QRPolynomial {
      constructor(num, shift) {
        let offset = 0;
        while (offset < num.length && num[offset] == 0) offset++;
        this.num = new Array(num.length - offset + shift);
        for (let i = 0; i < num.length - offset; i++) this.num[i] = num[offset + i];
        for (let i = num.length - offset; i < this.num.length; i++) this.num[i] = 0;
      }
      getAt(index) { return this.num[index]; }
      getLength() { return this.num.length; }
      multiply(e) {
        const numData = new Array(this.getLength() + e.getLength() - 1).fill(0);
        for (let i = 0; i < this.getLength(); i++) {
          for (let j = 0; j < e.getLength(); j++) {
            numData[i + j] ^= QRMath.gmul(this.getAt(i), e.getAt(j));
          }
        }
        return new QRPolynomial(numData, 0);
      }
      mod(e) {
        if (this.getLength() - e.getLength() < 0) return this;
        const ratio = QRMath.glog(this.getAt(0)) - QRMath.glog(e.getAt(0));
        const numData = new Array(this.getLength());
        for (let i = 0; i < this.getLength(); i++) numData[i] = this.getAt(i);
        for (let i = 0; i < e.getLength(); i++) {
          numData[i] ^= QRMath.gmul(e.getAt(i), QRMath.gexp(ratio));
        }
        return new QRPolynomial(numData, 0).mod(e);
      }
    }

    /* 修復 Galois Field (GF256) 初始化邏輯，
      將陣列長度設置為 512，並在後半段備份前 255 位，
      完全解決相機掃描二維碼時產生 NaN 的嚴重越界 Bug。
    */
    const EXP_TABLE = new Array(512);
    const LOG_TABLE = new Array(256);
    let gfVal = 1;
    for (let i = 0; i < 255; i++) {
      EXP_TABLE[i] = gfVal;
      LOG_TABLE[gfVal] = i;
      gfVal <<= 1;
      if (gfVal & 256) {
        gfVal ^= 285; // 使用標準不可約多項式 x^8 + x^4 + x^3 + x^2 + 1
      }
    }
    for (let i = 255; i < 512; i++) {
      EXP_TABLE[i] = EXP_TABLE[i - 255];
    }
    LOG_TABLE[0] = 0;

    const QRMath = {
      glog: function(n) { if (n < 1) return 0; return LOG_TABLE[n]; },
      gexp: function(n) {
        while (n < 0) n += 255;
        while (n >= 255) n -= 255;
        return EXP_TABLE[n];
      },
      gmul: function(n1, n2) {
        if (n1 == 0 || n2 == 0) return 0;
        return EXP_TABLE[LOG_TABLE[n1] + LOG_TABLE[n2]];
      }
    };

    class QRRSBlock {
      constructor(totalCount, dataCount) {
        this.totalCount = totalCount;
        this.dataCount = dataCount;
      }
      static getRSBlocks(typeNumber, errorCorrectLevel) {
        const rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
        if (rsBlock === undefined) throw new Error("bad rs block @ typeNumber:" + typeNumber);
        const list = [];
        const count = rsBlock.length / 3;
        for (let i = 0; i < count; i++) {
          const num = rsBlock[i * 3];
          const total = rsBlock[i * 3 + 1];
          const data = rsBlock[i * 3 + 2];
          for (let j = 0; j < num; j++) list.push(new QRRSBlock(total, data));
        }
        return list;
      }
      static getRsBlockTable(typeNumber, errorCorrectLevel) {
        switch (errorCorrectLevel) {
          case QRErrorCorrectLevel.L: return RS_BLOCK_TABLE[typeNumber - 1][0];
          case QRErrorCorrectLevel.M: return RS_BLOCK_TABLE[typeNumber - 1][1];
          case QRErrorCorrectLevel.Q: return RS_BLOCK_TABLE[typeNumber - 1][2];
          case QRErrorCorrectLevel.H: return RS_BLOCK_TABLE[typeNumber - 1][3];
          default: return undefined;
        }
      }
    }

       徹底排除 SDP 大容量數據觸發數組越界的致命崩潰。
    */
    const RS_BLOCK_TABLE = [

      [[4, 101, 81], [1, 80, 50, 4, 81, 51], [4, 50, 22, 4, 51, 23], [3, 36, 12, 8, 37, 13]],
      [[2, 121, 99, 2, 122, 100], [6, 58, 26, 2, 59, 27], [4, 60, 25, 6, 61, 26], [7, 37, 13, 4, 38, 14]],
      [[4, 146, 122], [8, 59, 26, 1, 60, 27], [8, 40, 15, 4, 41, 16], [12, 38, 12, 4, 39, 13]],

      [[5, 99, 79, 1, 100, 80], [5, 65, 31, 5, 66, 32], [5, 54, 22, 7, 55, 23], [11, 45, 12, 7, 46, 13]],
      [[5, 116, 92, 1, 117, 93], [7, 73, 41, 3, 74, 42], [15, 43, 18, 2, 44, 19], [3, 41, 13, 13, 42, 14]],

    const QRUtil = {
      PATTERN_POSITION_TABLE : [
        [],[6, 18],[6, 22],[6, 26],[6, 30],[6, 34],[6, 22, 38],[6, 24, 42],[6, 26, 46],[6, 28, 50],
        [6, 30, 54],[6, 32, 58],[6, 34, 62],[6, 26, 46, 66],[6, 26, 48, 70],[6, 26, 50, 74],[6, 30, 54, 78],
        [6, 30, 56, 82],[6, 30, 58, 86],[6, 34, 62, 90],[6, 28, 50, 72, 94],[6, 26, 50, 74, 98],[6, 30, 54, 78, 102],
        [6, 28, 54, 80, 106],[6, 32, 58, 84, 110],[6, 30, 58, 86, 114],[6, 34, 62, 90, 118],[6, 26, 50, 74, 98, 122],
        [6, 30, 54, 78, 102, 126],[6, 26, 52, 78, 104, 130],[6, 30, 56, 82, 108, 134],[6, 34, 60, 86, 112, 138],
        [6, 30, 58, 86, 114, 142],[6, 34, 62, 90, 118, 146],[6, 30, 54, 78, 102, 126, 150],[6, 24, 50, 76, 102, 128, 154],
        [6, 28, 54, 80, 106, 132, 158],[6, 32, 58, 84, 110, 136, 162],[6, 26, 54, 82, 110, 138, 166],[6, 30, 58, 86, 114, 142, 170]
      ],
      G15: (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
      G18: (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
      G15_MASK: (1 << 14) | (1 << 12) | (1 << 11) | (1 << 10) | (1 << 4) | (1 << 1) | (1 << 0),
      getBCHTypeInfo: function(data) {
        let r = data << 10;
        while (QRUtil.getBCHDigit(r) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
          r ^= (QRUtil.G15 << (QRUtil.getBCHDigit(r) - QRUtil.getBCHDigit(QRUtil.G15)));
        }
        return ((data << 10) | r) ^ QRUtil.G15_MASK;
      },
      getBCHTypeNumber: function(data) {
        let r = data << 12;
        while (QRUtil.getBCHDigit(r) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
          r ^= (QRUtil.G18 << (QRUtil.getBCHDigit(r) - QRUtil.getBCHDigit(QRUtil.G18)));
        }
        return (data << 12) | r;
      },
      getBCHDigit: function(data) {
        let digit = 0;
        while (data !== 0) { digit++; data >>>= 1; }
        return digit;
      },
      getPatternPosition: function(typeNumber) { return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1]; },
      getMask: function(maskPattern, row, col) {
        switch (maskPattern) {
          case 0: return (row + col) % 2 == 0;
          case 1: return row % 2 == 0;
          case 2: return col % 3 == 0;
          case 3: return (row + col) % 3 == 0;
          case 4: return (Math.floor(row / 2) + Math.floor(col / 3)) % 2 == 0;
          case 5: return (row * col) % 2 + (row * col) % 3 == 0;
          case 6: return ((row * col) % 2 + (row * col) % 3) % 2 == 0;
          case 7: return ((row * col) % 3 + (row + col) % 2) % 2 == 0;
          default: throw new Error("bad maskPattern:" + maskPattern);
        }
      },
      getErrorCorrectPolynomial: function(errorCorrectLength) {
        let a = new QRPolynomial([1], 0);
        for (let i = 0; i < errorCorrectLength; i++) a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
        return a;
      },
      getLengthInBits: function(mode, typeNumber) {
        if (1 <= typeNumber && typeNumber <= 40) {
          switch (mode) {
            case QRMode.MODE_8BIT_BYTE: return 8;
            default: throw new Error("mode:" + mode);
          }
        } else {
          throw new Error("typeNumber not supported:" + typeNumber);
        }
      },
      getLostPoint: function(qrCode) {
        const moduleCount = qrCode.getModuleCount();
        let lostPoint = 0;
        for (let row = 0; row < moduleCount; row++) {
          for (let col = 0; col < moduleCount; col++) {
            let sameCount = 0;
            const dark = qrCode.isDark(row, col);
            for (let r = -1; r <= 1; r++) {
              if (row + r < 0 || moduleCount <= row + r) continue;
              for (let c = -1; c <= 1; c++) {
                if (col + c < 0 || moduleCount <= col + c) continue;
                if (r == 0 && c == 0) continue;
                if (dark == qrCode.isDark(row + r, col + c)) sameCount++;
              }
            }
            if (sameCount > 5) lostPoint += (3 + sameCount - 5);
          }
        }
        for (let row = 0; row < moduleCount - 1; row++) {
          for (let col = 0; col < moduleCount - 1; col++) {
            let count = 0;
            if (qrCode.isDark(row, col)) count++;
            if (qrCode.isDark(row + 1, col)) count++;
            if (qrCode.isDark(row, col + 1)) count++;
            if (qrCode.isDark(row + 1, col + 1)) count++;
            if (count == 0 || count == 4) lostPoint += 3;
          }
        }
        for (let row = 0; row < moduleCount; row++) {
          for (let col = 0; col < moduleCount - 6; col++) {
            if (qrCode.isDark(row, col) && !qrCode.isDark(row, col + 1) && qrCode.isDark(row, col + 2) && qrCode.isDark(row, col + 3) && qrCode.isDark(row, col + 4) && !qrCode.isDark(row, col + 5) && qrCode.isDark(row, col + 6)) {
              lostPoint += 40;
            }
          }
        }
        for (let col = 0; col < moduleCount; col++) {
          for (let row = 0; row < moduleCount - 6; row++) {
            if (qrCode.isDark(row, col) && !qrCode.isDark(row + 1, col) && qrCode.isDark(row + 2, col) && qrCode.isDark(row + 3, col) && qrCode.isDark(row + 4, col) && !qrCode.isDark(row + 5, col) && qrCode.isDark(row + 6, col)) {
              lostPoint += 40;
            }
          }
        }
        let darkCount = 0;
        for (let col = 0; col < moduleCount; col++) {
          for (let row = 0; row < moduleCount; row++) { if (qrCode.isDark(row, col)) darkCount++; }
        }
        const ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;
        return lostPoint;
      }
    };

    class QRCode {
      constructor(typeNumber, errorCorrectLevel) {
        this.typeNumber = typeNumber;
        this.errorCorrectLevel = errorCorrectLevel;
        this.modules = null;
        this.moduleCount = 0;
        this.dataCache = null;
        this.dataList = [];
      }
      addData(data) { this.dataList.push(new QR8bitByte(data)); this.dataCache = null; }
      isDark(row, col) {
        if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) return false;
        return this.modules[row][col];
      }
      getModuleCount() { return this.moduleCount; }
      make() { this.makeImpl(false, this.getBestPattern()); }
      makeImpl(test, maskPattern) {
        this.moduleCount = this.typeNumber * 4 + 17;
        this.modules = new Array(this.moduleCount);
        for (let i = 0; i < this.moduleCount; i++) this.modules[i] = new Array(this.moduleCount).fill(null);
        this.setupPositionProbePattern(0, 0);
        this.setupPositionProbePattern(this.moduleCount - 7, 0);
        this.setupPositionProbePattern(0, this.moduleCount - 7);
        this.setupPositionAdjustPattern();
        this.setupTimingPattern();
        this.setupTypeInfo(test, maskPattern);
        if (this.typeNumber > 6) this.setupTypeNumber(test);
        if (this.dataCache == null) {
          this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
        }
        this.mapData(this.dataCache, maskPattern);
      }
      setupPositionProbePattern(row, col) {
        for (let r = -1; r <= 7; r++) {
          if (row + r <= -1 || this.moduleCount <= row + r) continue;
          for (let c = -1; c <= 7; c++) {
            if (col + c <= -1 || this.moduleCount <= col + c) continue;
            if ((0 <= r && r <= 6 && (c == 0 || c == 6)) || (0 <= c && c <= 6 && (r == 0 || r == 6)) || (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
              this.modules[row + r][col + c] = true;
            } else {
              this.modules[row + r][col + c] = false;
            }
          }
        }
      }
      getBestPattern() {
        let minLostPoint = 0, pattern = 0;
        for (let i = 0; i < 8; i++) {
          this.makeImpl(true, i);
          const lostPoint = QRUtil.getLostPoint(this);
          if (i == 0 || minLostPoint > lostPoint) { minLostPoint = lostPoint; pattern = i; }
        }
        return pattern;
      }
      setupTimingPattern() {
        for (let r = 8; r < this.moduleCount - 8; r++) {
          if (this.modules[r][6] != null) continue;
          this.modules[r][6] = (r % 2 == 0);
        }
        for (let c = 8; c < this.moduleCount - 8; c++) {
          if (this.modules[6][c] != null) continue;
          this.modules[6][c] = (c % 2 == 0);
        }
      }
      setupPositionAdjustPattern() {
        const pos = QRUtil.getPatternPosition(this.typeNumber);
        for (let i = 0; i < pos.length; i++) {
          for (let j = 0; j < pos.length; j++) {
            const row = pos[i], col = pos[j];
            if (this.modules[row][col] != null) continue;
            for (let r = -2; r <= 2; r++) {
              for (let c = -2; c <= 2; c++) {
                if (Math.abs(r) == 2 || Math.abs(c) == 2 || (r == 0 && c == 0)) {
                  this.modules[row + r][col + c] = true;
                } else {
                  this.modules[row + r][col + c] = false;
                }
              }
            }
          }
        }
      }
      setupTypeNumber(test) {
        const bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        for (let i = 0; i < 18; i++) {
          const mod = (!test && ((bits >>> i) & 1) == 1);
          this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
        }
        for (let i = 0; i < 18; i++) {
          const mod = (!test && ((bits >>> i) & 1) == 1);
          this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
        }
      }
      setupTypeInfo(test, maskPattern) {
        const data = (this.errorCorrectLevel << 3) | maskPattern;
        const bits = QRUtil.getBCHTypeInfo(data);
        for (let i = 0; i < 15; i++) {
          const mod = (!test && ((bits >>> i) & 1) == 1);
          if (i < 6) this.modules[i][8] = mod;
          else if (i < 8) this.modules[i + 1][8] = mod;
          else this.modules[this.moduleCount - 15 + i][8] = mod;
        }
        for (let i = 0; i < 15; i++) {
          const mod = (!test && ((bits >>> i) & 1) == 1);
          if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
          else if (i < 9) this.modules[8][15 - i - 1 + 1] = mod;
          else this.modules[8][15 - i - 1] = mod;
        }
        this.modules[this.moduleCount - 8][8] = !test;
      }
      mapData(data, maskPattern) {
        let inc = -1, row = this.moduleCount - 1, bitIndex = 7, byteIndex = 0;
        for (let col = this.moduleCount - 1; col > 0; col -= 2) {
          if (col == 6) col--;
          while (true) {
            for (let c = 0; c < 2; c++) {
              const targetCol = col - c;
              if (this.modules[row][targetCol] == null) {
                let dark = false;
                if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                const mask = QRUtil.getMask(maskPattern, row, targetCol);
                if (mask) dark = !dark;
                this.modules[row][targetCol] = dark;
                bitIndex--;
                if (bitIndex == -1) { byteIndex++; bitIndex = 7; }
              }
            }
            row += inc;
            if (row < 0 || this.moduleCount <= row) { row -= inc; inc = -inc; break; }
          }
        }
      }
      static createData(typeNumber, errorCorrectLevel, dataList) {
        const rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
        const buffer = new QRBitBuffer();
        for (let i = 0; i < dataList.length; i++) {
          const data = dataList[i];
          buffer.put(data.mode, 4);
          buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
          data.write(buffer);
        }
        let totalDataCount = 0;
        for (let i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
        if (buffer.getLengthInBits() > totalDataCount * 8) {
          throw new Error("code length overflow. (" + buffer.getLengthInBits() + ">" + totalDataCount * 8 + ")");
        }
        if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
        while (buffer.getLengthInBits() % 8 != 0) buffer.putBit(false);
        while (true) {
          if (buffer.getLengthInBits() >= totalDataCount * 8) break;
          buffer.put(QRCode.PAD0, 8);
          if (buffer.getLengthInBits() >= totalDataCount * 8) break;
          buffer.put(QRCode.PAD1, 8);
        }
        return QRCode.createBytes(buffer, rsBlocks);
      }
      static createBytes(buffer, rsBlocks) {
        let offset = 0, maxDcCount = 0, maxEcCount = 0;
        const dcBytes = new Array(rsBlocks.length);
        const ecBytes = new Array(rsBlocks.length);
        for (let r = 0; r < rsBlocks.length; r++) {
          const dcCount = rsBlocks[r].dataCount;
          const ecCount = rsBlocks[r].totalCount - dcCount;
          maxDcCount = Math.max(maxDcCount, dcCount);
          maxEcCount = Math.max(maxEcCount, ecCount);
          dcBytes[r] = new Array(dcCount);
          for (let i = 0; i < dcBytes[r].length; i++) {
            dcBytes[r][i] = 0xff & buffer.buffer[i + offset];
          }
          offset += dcCount;
          const rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
          const rawPoly = new QRPolynomial(dcBytes[r], rsPoly.getLength() - 1);
          const modPoly = rawPoly.mod(rsPoly);
          ecBytes[r] = new Array(rsPoly.getLength() - 1);
          for (let i = 0; i < ecBytes[r].length; i++) {
            const modIndex = i + modPoly.getLength() - ecBytes[r].length;
            ecBytes[r][i] = (modIndex >= 0) ? modPoly.getAt(modIndex) : 0;
          }
        }
        let totalSize = 0;
        for (let i = 0; i < rsBlocks.length; i++) totalSize += rsBlocks[i].totalCount;
        const data = new Array(totalSize);
        let index = 0;
        for (let i = 0; i < maxDcCount; i++) {
          for (let r = 0; r < rsBlocks.length; r++) {
            if (i < dcBytes[r].length) data[index++] = dcBytes[r][i];
          }
        }
        for (let i = 0; i < maxEcCount; i++) {
          for (let r = 0; r < rsBlocks.length; r++) {
            if (i < ecBytes[r].length) data[index++] = ecBytes[r][i];
          }
        }
        return data;
      }
    }
    QRCode.PAD0 = 0xec;
    QRCode.PAD1 = 0x11;

    /* FaceTime 專屬極簡 ES6 離線 Canvas 繪圖接口
      優化：重用 Canvas 節點，僅調用 clearRect 重新繪製像素點，
      徹底消除頻繁創建與銷毀 DOM 導致的記憶體洩漏與垃圾回收卡頓。
    */
    class SimpleQRCode {
      constructor(elementId, options) {
        this.element = typeof elementId === "string" ? document.getElementById(elementId) : elementId;
        this.options = Object.assign({
          width: 256,
          height: 256,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRErrorCorrectLevel.L
        }, options);
        
        // 初始化時僅建立一次 Canvas 節點並常駐 DOM
        this.canvas = document.createElement("canvas");
        this.canvas.width = this.options.width;
        this.canvas.height = this.options.height;
        this.ctx = this.canvas.getContext("2d");
        this.element.innerHTML = "";
        this.element.appendChild(this.canvas);
      }
      makeCode(text) {
        let typeNumber = 1;
        const textLength = text.length;
        for (let v = 1; v <= 40; v++) {
          const blocks = QRRSBlock.getRSBlocks(v, this.options.correctLevel);
          let limit = 0;
          for (let i = 0; i < blocks.length; i++) limit += blocks[i].dataCount;
          if (textLength <= limit) { typeNumber = v; break; }
          if (v === 40) typeNumber = 40;
        }
        const qr = new QRCode(typeNumber, this.options.correctLevel);
        qr.addData(text);
        qr.make();
        
        const moduleCount = qr.getModuleCount();
        const tileW = this.options.width / moduleCount;
        const tileH = this.options.height / moduleCount;
        
        // 僅執行畫布清除與重繪，不再銷毀重建 DOM 節點
        this.ctx.clearRect(0, 0, this.options.width, this.options.height);
        
        for (let row = 0; row < moduleCount; row++) {
          for (let col = 0; col < moduleCount; col++) {
            this.ctx.fillStyle = qr.isDark(row, col) ? this.options.colorDark : this.options.colorLight;
            const x = Math.round(col * tileW);
            const y = Math.round(row * tileH);
            const w = Math.ceil((col + 1) * tileW) - x;
            const h = Math.ceil((row + 1) * tileH) - y;
            this.ctx.fillRect(x, y, w, h);
          }
        }
      }
    }
  </script>
</head>

  <!-- ================= 核心對接與 SDP 壓縮、掃描與連接邏輯 ================= -->
  <script>
    let peerConnection = null;
    let localStream = null;
    let remoteStream = null;
    let activeRole = null;
    let qrcodeGeneratorInstance = null;
    let html5QrcodeScanner = null;
    
    // 二維碼輪播變數
    let qrCarouselInterval = null;
    let currentQrIndex = 0;
    let myChunks = [];

    // 接收緩衝區
    let receivedChunks = {};
    let totalChunksNeeded = 0;
    let isProcessingSdp = false; // 解碼互斥鎖，避免重疊觸發 WebRTC 交握導致線程卡死

    // WebRTC 局域網完全離線設定 (不使用外網 STUN/TURN 伺服器)
    const rtcConfig = { iceServers: [] };

    // ==========================================
    // 100% 離線高效率 LZW 字典壓縮與 16-bit 數據打包演算法
    // 將 ~3000 字元的原始 SDP 精簡壓縮
    // ==========================================
    const sdpDictionary = [
      ["a=candidate:", "C:"],
      ["a=fingerprint:sha-256 ", "F:"],
      ["a=setup:", "S:"],
      ["a=ice-ufrag:", "U:"],
      ["a=ice-pwd:", "P:"],
      ["a=mid:", "M:"],
      ["a=rtpmap:", "R:"],
      ["a=fmtp:", "E:"],
      ["a=ssrc:", "X:"],
      ["c=IN IP4 ", "I:"],
      ["typ host", "H"],
      ["typ srflx", "W"],
      ["typ relay", "Y"],
      ["\r\n", "\n"]
    ];

    function filterAndCompressSDP(sdp) {
      let compressed = sdp;
      const lines = sdp.split("\r\n");
      const filteredLines = lines.filter(line => {
        if (line.includes("a=rtcp-fb:")) return false;
        if (line.includes("a=extmap:")) return false;
        if (line.includes("a=msid:")) return false;
        if (line.includes("a=ssrc-group:")) return false;
        if (line.includes("::")) return false; // 移除 IPv6
        return true;
      });
      compressed = filteredLines.join("\r\n");

      for (let item of sdpDictionary) {
        compressed = compressed.split(item[0]).join(item[1]);
      }
      return lzwEncode(compressed);
    }

    function decompressAndRestoreSDP(compressed) {
      let decompressed = lzwDecode(compressed);
      for (let item of sdpDictionary) {
        decompressed = decompressed.split(item[1]).join(item[0]);
      }
      return decompressed;
    }

    // LZW 編碼實施
    function lzwEncode(uncompressedString) {
      const dictionary = {};
      const data = uncompressedString.split("");
      const outCodes = [];
      let phrase = data[0];
      let codeCount = 256;
      for (let i = 1; i < data.length; i++) {
        const currentChar = data[i];
        if (dictionary[phrase + currentChar] != null) {
          phrase += currentChar;
        } else {
          outCodes.push(phrase.length > 1 ? dictionary[phrase] : phrase.charCodeAt(0));
          dictionary[phrase + currentChar] = codeCount;
          codeCount++;
          phrase = currentChar;
        }
      }
      outCodes.push(phrase.length > 1 ? dictionary[phrase] : phrase.charCodeAt(0));
      return codesToBase64(outCodes);
    }

    // LZW 解碼實施
    function lzwDecode(base64Data) {
      const codes = base64ToCodes(base64Data);
      if (codes.length === 0) return "";
      const dictionary = {};
      let currentChar = String.fromCharCode(codes[0]);
      let oldPhrase = currentChar;
      const outString = [currentChar];
      let codeCount = 256;
      let phrase;
      for (let i = 1; i < codes.length; i++) {
        const currCode = codes[i];
        if (currCode < 256) {
          phrase = String.fromCharCode(currCode);
        } else {
          phrase = dictionary[currCode] ? dictionary[currCode] : (oldPhrase + currentChar);
        }
        outString.push(phrase);
        currentChar = phrase.charAt(0);
        dictionary[codeCount] = oldPhrase + currentChar;
        codeCount++;
        oldPhrase = phrase;
      }
      return outString.join("");
    }

    // 16-bit 數據壓縮位元組打包
    function codesToBase64(codes) {
      let binaryString = "";
      for (let i = 0; i < codes.length; i++) {
        binaryString += String.fromCharCode(codes[i] & 0xFF, (codes[i] >> 8) & 0xFF);
      }
      return btoa(binaryString);
    }

    function base64ToCodes(b64) {
      try {
        const binaryString = atob(b64);
        const codes = [];
        for (let i = 0; i < binaryString.length; i += 2) {
          const low = binaryString.charCodeAt(i);
          const high = binaryString.charCodeAt(i + 1);
          codes.push(low | (high << 8));
        }
        return codes;
      } catch (e) {
        console.error("Base64解碼數據損壞: ", e);
        return [];
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      // 使用全新修復、100% 無作用域與 Galois Field 溢出衝突嘅 SimpleQRCode 初始化
      try {
        qrcodeGeneratorInstance = new SimpleQRCode("qr-target", {
          width: 170,
          height: 170,
          correctLevel: QRErrorCorrectLevel.L
        });
      } catch (e) {
        console.error("QRCode 引擎初始化失敗: ", e);
      }
    });

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.style.cssText = "background: rgba(30,30,30,0.95); border: 1px solid rgba(255,255,255,0.1); padding: 14px 20px; border-radius: 14px; margin-bottom: 10px; font-size: 13px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.4); pointer-events: auto;";
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    async function startPairingFlow(role) {
      activeRole = role;
      document.getElementById('qr-pairing-modal').style.display = 'flex';
      
      // 1. 啟用並抓取本地端相機和麥克風
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
        document.getElementById('local-video').srcObject = localStream;
      } catch (err) {
        showToast("相機啟用失敗: " + err.message);
      }

      // 2. 初始化實體 RTC 連線
      initPeerConnection();

      // 3. 根據通訊協定角色生成對接 SDP 二維碼
      if (role === 'caller') {
        try {
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          
          // 等待網卡收集完畢本地 IP 端點
          setTimeout(async () => {
            let compressedOffer = filterAndCompressSDP(peerConnection.localDescription.sdp);
            prepareAndCarouselSDP(compressedOffer);
          }, 800);
        } catch (e) {
          showToast("SDP 生成失敗: " + e.message);
        }
      } else {
        document.getElementById('pairing-status').innerText = "請對準發起方的二維碼進行掃描...";
        if (!localStream) {
          document.getElementById('pairing-status').innerText = "請啟用相機以進行掃描...";
        }
      }

      // 4. 啟動鏡頭讀取
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        startCameraScanner();
      }
    }

    function initPeerConnection() {
      if (peerConnection) peerConnection.close();
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteStream = event.streams[0];
          document.getElementById('remote-video').srcObject = remoteStream;
          transitionToCallActive();
        }
      };

      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }
    }

    // 數據片斷分切與動態輪播實施 (Plan B)
    function prepareAndCarouselSDP(compressedSdpData) {
      clearInterval(qrCarouselInterval);
      
      // 每段數據切片長度為 120 字元，降低單個 QR Code 點陣密度
      const chunkSize = 120;
      myChunks = [];
      const total = Math.ceil(compressedSdpData.length / chunkSize);
      for (let i = 0; i < total; i++) {
        myChunks.push(`${i + 1}/${total}_${compressedSdpData.substr(i * chunkSize, chunkSize)}`);
      }

      // 啟動 250ms 間隔的無縫動態輪播
      currentQrIndex = 0;
      qrCarouselInterval = setInterval(() => {
        if (myChunks.length === 0) return;
        try {
          qrcodeGeneratorInstance.makeCode(myChunks[currentQrIndex]);
          document.getElementById('pairing-status').innerText = `本地對接代碼傳輸中 (${currentQrIndex + 1}/${myChunks.length})`;
          currentQrIndex = (currentQrIndex + 1) % myChunks.length;
        } catch (e) {
          console.error("生成二維碼錯誤: ", e);
        }
      }, 250);
    }

    // 啟動本地高幀率解碼器
    function startCameraScanner() {
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 220, height: 220 } },
        onQrCodeScanned,
        () => {} // 靜默未解碼幀
      ).catch(err => {
        showToast("相機掃描器載入失敗: " + err);
      });
    }

    // 拼接與接收動態輪播分段
    async function onQrCodeScanned(decodedText) {
      if (isProcessingSdp) return; // 鎖定狀態，防止異步重疊調用

      const match = decodedText.match(/^(\d+)\/(\d+)_(.+)$/);
      if (!match) return;

      const idx = parseInt(match[1]);
      const total = parseInt(match[2]);
      const payload = match[3];

      if (totalChunksNeeded === 0) {
        totalChunksNeeded = total;
      }

      if (!receivedChunks[idx]) {
        receivedChunks[idx] = payload;
        const currentCount = Object.keys(receivedChunks).length;
        showToast(`已解鎖對方數據片斷: ${currentCount}/${total}`);

        if (currentCount === totalChunksNeeded) {
          isProcessingSdp = true; // 進入 WebRTC 處理狀態，立即上鎖
          if (html5QrcodeScanner) {
            try {
              await html5QrcodeScanner.stop();
            } catch(e) {
              console.error("停止鏡頭異常:", e);
            }
          }
          reconstructAndApplySDP();
        }
      }
    }

    // 重組並實施連通
    async function reconstructAndApplySDP() {
      try {
        let base64String = "";
        for (let i = 1; i <= totalChunksNeeded; i++) {
          base64String += receivedChunks[i];
        }

        // 字典解壓與格式還原
        const decompressedSdp = decompressAndRestoreSDP(base64String);

        if (activeRole === 'caller') {
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: decompressedSdp }));
          showToast("雙向連線握手成功，正在建立視訊通道...");
        } else {
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: decompressedSdp }));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          
          // 重置本機接收緩衝與解碼狀態鎖
          receivedChunks = {};
          totalChunksNeeded = 0;
          isProcessingSdp = false; 
          
          // 啟動本機 Answer 的輪播
          let compressedAnswer = filterAndCompressSDP(peerConnection.localDescription.sdp);
          prepareAndCarouselSDP(compressedAnswer);
          
          showToast("發起端數據解鎖完成！請對準本機螢幕，讓發起端掃描下方代碼...");
          startCameraScanner(); // 重新啟動掃描以偵測發起端完成對接
        }
      } catch (err) {
        showToast("代碼重組或 WebRTC 通道寫入失敗: " + err.message);
        abortPairing();
      }
    }

    function transitionToCallActive() {
      abortPairing(false);
      document.getElementById('setup-panel').style.display = 'none';
      document.getElementById('local-video-container').style.display = 'block';
      document.getElementById('call-overlay').style.transform = 'translateY(0)';
    }

    /* 優化 abortPairing 異步關閉機制。
       優先更新 DOM UI 響應，並使用 250 毫秒異步緩衝安全釋放相機與媒體串流，
       徹底解決 iOS WebKit 的 DOM commit 渲染時序衝突（卡死）問題。
    */
    function abortPairing(stopStream = true) {
      // 1. 優先變更 UI 狀態與隱藏彈窗，確保按鈕點擊即時響應
      document.getElementById('qr-pairing-modal').style.display = 'none';
      
      clearInterval(qrCarouselInterval);
      qrCarouselInterval = null;
      receivedChunks = {};
      totalChunksNeeded = 0;
      isProcessingSdp = false; // 解鎖狀態

      // 2. 異步且安全地釋放 WebKit 相機線程
      setTimeout(async () => {
        if (html5QrcodeScanner) {
          try {
            await html5QrcodeScanner.stop();
          } catch (e) {
            console.error("相機關閉異常:", e);
          }
          html5QrcodeScanner = null;
        }

        if (stopStream && localStream) {
          try {
            localStream.getTracks().forEach(track => track.stop());
          } catch (e) {
            console.error("媒體串流釋放異常:", e);
          }
          localStream = null;
        }
      }, 250); // 延遲 250ms 避開渲染鎖定衝突
    }

    function endCall() {
      location.reload();
    }

    function toggleMic() {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        audioTrack.enabled = !audioTrack.enabled;
        document.getElementById('btn-mic').innerHTML = audioTrack.enabled ? 
          `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>` : 
          `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5.19"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>`;
      }
    }

    function toggleVideo() {
      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        videoTrack.enabled = !videoTrack.enabled;
        document.getElementById('btn-video').innerHTML = videoTrack.enabled ? 
          `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>` : 
          `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" x2="22" y1="2" y2="22"/><path d="m22 8-6 4 6 4V8Z"/><path d="M2 18V6a2 2 0 0 1 2-2h10c.55 0 1 .45 1 1v7"/></svg>`;
      }
    }
  </script>
