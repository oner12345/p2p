<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FaceTime Web - P2P Serverless Connect</title>
  <style>
    /* 原生 Apple 風格響應式 CSS 樣式表 - 100% 離線可用 */
    :root {
      --sat: env(safe-area-inset-top);
      --sab: env(safe-area-inset-bottom);
      --apple-green: #30D158;
      --apple-red: #FF453A;
      --apple-dark: #1C1C1E;
      --apple-gray: #2C2C2E;
      --apple-light-gray: #3A3A3C;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      height: 100%;
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overscroll-behavior: none;
    }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .hidden { display: none !important; }
    .fixed { position: fixed; }
    .absolute { position: absolute; }
    .inset-0 { top: 0; left: 0; right: 0; bottom: 0; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .object-cover { object-fit: cover; }
    .blur-bg {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .mirror-view { transform: scaleX(-1); }
    
    /* 主面板 */
    #setup-panel {
      background-color: rgba(0, 0, 0, 0.85);
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .panel-container {
      width: 100%;
      max-width: 420px;
      margin: auto;
    }
    .app-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .logo-box {
      width: 40px;
      height: 40px;
      background-color: var(--apple-green);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(48, 209, 88, 0.4);
    }
    .logo-text {
      font-size: 1.25rem;
      font-weight: 600;
      margin-left: 10px;
    }
    .badge {
      background-color: rgba(48, 209, 88, 0.2);
      color: var(--apple-green);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 700;
      margin-left: 6px;
    }
    
    /* 按鈕 */
    .apple-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .apple-btn:active { transform: scale(0.97); }
    .btn-green { background-color: var(--apple-green); color: #000000; }
    .btn-green:hover { background-color: #2bc050; }
    .btn-gray { background-color: var(--apple-light-gray); color: #ffffff; }
    .btn-gray:hover { background-color: #4a4a4c; }
    .btn-red { background-color: var(--apple-red); color: #ffffff; }
    
    /* 卡片與容器 */
    .card {
      background-color: var(--apple-gray);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 16px;
    }
    .text-muted { color: #a1a1a6; font-size: 0.85rem; line-height: 1.5; text-align: center; }
    
    /* 二維碼對接介面 */
    #qr-pairing-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: #000000;
      display: none;
      flex-direction: column;
      height: 100dvh;
    }
    .scan-half {
      flex: 1.1;
      position: relative;
      background-color: #050505;
      overflow: hidden;
      border-bottom: 2px solid var(--apple-light-gray);
    }
    .qr-half {
      flex: 0.9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      padding: 16px;
      gap: 16px;
    }
    .qr-container {
      width: 190px;
      height: 190px;
      background-color: #ffffff;
      padding: 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #reader {
      width: 100%;
      height: 100%;
    }
    .scan-target-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border: 3px solid var(--apple-green);
      border-radius: 24px;
      box-shadow: 0 0 0 4000px rgba(0,0,0,0.65);
      pointer-events: none;
    }
    .pairing-progress {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--apple-green);
      text-align: center;
      letter-spacing: 0.5px;
    }
    
    /* 視訊視窗 */
    #local-video-container {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 110px;
      height: 165px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: none;
    }
    
    /* 通話進行中控制列 */
    #call-overlay {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 24px;
      padding-bottom: max(2rem, var(--sab));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .control-bar {
      background-color: rgba(30, 30, 32, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 16px 24px;
      border-radius: 40px;
      display: flex;
      gap: 20px;
      pointer-events: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
    }
    .round-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background-color: var(--apple-light-gray);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      font-size: 1.3rem;
      transition: background-color 0.2s;
    }
    .round-btn:active { transform: scale(0.92); }
    .round-btn-red { background-color: var(--apple-red); }
    .round-btn-red:hover { background-color: #ff3b30; }
  </style>

  <!-- 2. html5-qrcode.min.js (高效率本地攝像頭解碼庫) -->
  <script src="https://unpkg.com/html5-qrcode" crossorigin="anonymous"></script>
</head>
<body class="flex flex-col justify-between">

  <!-- Toast 訊息容器 -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[110] w-11/12 max-w-sm pointer-events-none"></div>

  <!-- 背景遠端影片區 (通話中顯示) -->
  <div class="fixed inset-0 z-0 bg-black w-full h-full">
    <video id="remote-video" class="w-full h-full object-cover" autoplay playsinline></video>
    <div id="video-placeholder" class="fixed inset-0 flex flex-col items-center justify-center bg-zinc-950 text-zinc-500 transition-opacity duration-500 z-[1]">
      <span class="text-sm font-medium">等待影片串流...</span>
    </div>
  </div>

  <!-- 浮動本地影片預覽 (通話中子畫面) -->
  <div id="local-video-container" class="z-30">
    <video id="local-video" class="w-full h-full object-cover mirror-view" autoplay playsinline muted></video>
  </div>

  <!-- ================= 主設置面板 ================= -->
  <div id="setup-panel" class="fixed inset-0 z-20">
    <div class="panel-container">
      
      <!-- 標題列 -->
      <div class="app-title-bar">
        <div class="flex items-center">
          <div class="logo-box">
            <!-- 內置 SVG 圖標 - 100% 離線可用 -->
            <svg class="w-5 h-5 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M23 7l-7 5 7 5V7z"/>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
          </div>
          <span class="logo-text">FaceTime <span class="badge">無網 P2P 版</span></span>
        </div>
      </div>

      <!-- 操作區卡片 -->
      <div class="card flex flex-col gap-4">
        <p class="text-muted">本網頁完全在本地瀏覽器運行。雙方連線至同一個實體 Wi-Fi 網絡，點擊下方角色按鈕並互相對準掃描二維碼，即可進行高畫質視訊連線。</p>
        
        <div class="flex gap-2">
          <button id="btn-caller" onclick="startPairingFlow('caller')" class="apple-btn btn-green flex-1">我是發起方</button>
          <button id="btn-receiver" onclick="startPairingFlow('receiver')" class="apple-btn btn-gray flex-1">我是接聽方</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= 二維碼雙向對接彈窗 (z-100) ================= -->
  <div id="qr-pairing-modal">
    <!-- 上半部：鏡頭掃描器 -->
    <div class="scan-half">
      <div id="reader"></div>
      <div class="scan-target-box"></div>
    </div>
    
    <!-- 下半部：本機 SDP 二維碼 -->
    <div class="qr-half">
      <div class="pairing-progress" id="pairing-status">正在啟用相機與生成對接代碼...</div>
      <div class="qr-container" id="qr-target"></div>
      <button onclick="abortPairing()" class="apple-btn btn-red" style="max-width: 180px;">取消配對</button>
    </div>
  </div>

  <!-- ================= 通話控制列 ================= -->
  <div id="call-overlay">
    <div class="control-bar">
      <button onclick="toggleMic()" class="round-btn" id="btn-mic">🎙️</button>
      <button onclick="toggleVideo()" class="round-btn" id="btn-video">📹</button>
      <button onclick="endCall()" class="round-btn round-btn-red">📞</button>
    </div>
  </div>

  <!-- ================= 核心對接與 SDP 字典壓縮邏輯 ================= -->
  <script>
    let peerConnection = null;
    let localStream = null;
    let remoteStream = null;
    let activeRole = null;
    let qrcodeGen = null;
    let html5QrcodeScanner = null;

    // WebRTC 局域網完全離線設定 (不使用外網 STUN/TURN 伺服器)
    const rtcConfig = { iceServers: [] };

    // ==========================================
    // 100% 離線高效率 WebRTC SDP 字典壓縮演算法
    // 將 ~3000 字元的原始 SDP 精簡並壓縮至 ~350 字元
    // ==========================================
    const sdpDictionary = [
      ["a=candidate:", "C:"],
      ["a=fingerprint:sha-256 ", "F:"],
      ["a=setup:", "S:"],
      ["a=ice-ufrag:", "U:"],
      ["a=ice-pwd:", "P:"],
      ["a=mid:", "M:"],
      ["a=rtpmap:", "R:"],
      ["a=fmtp:", "E:"],
      ["a=ssrc:", "X:"],
      ["c=IN IP4 ", "I:"],
      ["typ host", "H"],
      ["typ srflx", "W"],
      ["typ relay", "Y"],
      ["\r\n", "\n"]
    ];

    function compressSDP(sdp) {
      let compressed = sdp;
      // 1. 過濾非必要之 SDP 描述行，僅保留基礎音視訊通訊軌道
      const lines = sdp.split("\r\n");
      const filteredLines = lines.filter(line => {
        // 移除不必要之編解碼器、組播候選和 ICE 傳輸控制描述
        if (line.includes("a=rtcp-fb:")) return false;
        if (line.includes("a=extmap:")) return false;
        if (line.includes("a=msid:")) return false;
        if (line.includes("a=ssrc-group:")) return false;
        if (line.includes("::")) return false; // 移除 IPv6 候選
        return true;
      });
      compressed = filteredLines.join("\r\n");

      // 2. 執行字典壓縮替換
      for (let item of sdpDictionary) {
        compressed = compressed.split(item[0]).join(item[1]);
      }
      return compressed;
    }

    function decompressSDP(compressed) {
      let decompressed = compressed;
      // 1. 還原字典替換
      for (let item of sdpDictionary) {
        decompressed = decompressed.split(item[1]).join(item[0]);
      }
      return decompressed;
    }

    document.addEventListener("DOMContentLoaded", () => {
      // 確保 QRCode.js 加載完成後正確初始化
      try {
        qrcodeGen = new QRCode("qr-target", {
          width: 170,
          height: 170,
          correctLevel: QRCode.CorrectLevel.L // Low 容錯率，在數據量大時將點陣密度降至最低，極速提升對焦成功率
        });
      } catch (e) {
        console.error("QR Code 引擎初始化失敗: ", e);
      }
    });

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.style.cssText = "background: rgba(30,30,30,0.95); border: 1px solid rgba(255,255,255,0.1); padding: 14px 20px; border-radius: 14px; margin-bottom: 10px; font-size: 13px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.4); pointer-events: auto;";
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    async function startPairingFlow(role) {
      activeRole = role;
      document.getElementById('qr-pairing-modal').style.display = 'flex';
      
      // 1. 啟用並抓取本地端相機和麥克風
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
        document.getElementById('local-video').srcObject = localStream;
      } catch (err) {
        showToast("相機啟用失敗: " + err.message);
        abortPairing();
        return;
      }

      // 2. 初始化 WebRTC 連線
      initPeerConnection();

      // 3. 根據通訊協定角色生成對接 SDP 二維碼
      if (role === 'caller') {
        try {
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          
          // 等待 ICE 候選收集完畢以獲取局域網 IP (等候 800 毫秒)
          setTimeout(async () => {
            const compressedOffer = compressSDP(peerConnection.localDescription.sdp);
            qrcodeGen.makeCode(compressedOffer);
            document.getElementById('pairing-status').innerText = "本地呼叫代碼 (Offer) 已生成，請用另一部設備掃描";
          }, 800);
        } catch (e) {
          showToast("SDP 生成失敗: " + e.message);
        }
      } else {
        document.getElementById('pairing-status').innerText = "請對準發起方的二維碼進行掃描...";
      }

      // 4. 啟動鏡頭自動解碼
      startCameraScanner();
    }

    function initPeerConnection() {
      if (peerConnection) peerConnection.close();
      peerConnection = new RTCPeerConnection(rtcConfig);

      // 當接收到遠端視訊軌道時，自動接入並進入通話狀態
      peerConnection.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteStream = event.streams[0];
          document.getElementById('remote-video').srcObject = remoteStream;
          transitionToCallActive();
        }
      };

      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }
    }

    // 啟動解碼掃描器
    function startCameraScanner() {
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 220 },
        onQrCodeScanned,
        () => {} // 忽略掃描未命中幀
      ).catch(err => {
        showToast("相機掃描器載入失敗: " + err);
      });
    }

    // 解析二維碼並實施 SDP 交換
    async function onQrCodeScanned(decodedText) {
      try {
        // 停止掃描器
        if (html5QrcodeScanner) {
          await html5QrcodeScanner.stop();
        }

        const decompressedSdp = decompressSDP(decodedText);

        if (activeRole === 'caller') {
          // 發起方接收 Answer 建立通道
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: decompressedSdp }));
          showToast("雙向代碼識別成功！正在建立通話通道...");
        } else {
          // 接聽方設置 Offer -> 建立 Answer -> 回傳 Answer 的靜態二維碼
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: decompressedSdp }));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          
          // 將 Answer SDP 壓縮並轉化為二維碼，供發起方掃描
          const compressedAnswer = compressSDP(peerConnection.localDescription.sdp);
          qrcodeGen.makeCode(compressedAnswer);
          document.getElementById('pairing-status').innerText = "呼叫已解析！請用發起方的設備掃描下方 Answer 代碼";
          showToast("Offer 解析成功！請讓發起方掃描下方的 Answer 代碼...");
          
          // 重啟接聽方相機，用以偵測最終通道連通
          startCameraScanner();
        }
      } catch (err) {
        showToast("代碼解析或寫入失敗，請確認雙方是否在同一個 Wi-Fi 網絡下");
        abortPairing();
      }
    }

    function transitionToCallActive() {
      abortPairing(false);
      document.getElementById('setup-panel').style.display = 'none';
      document.getElementById('local-video-container').style.display = 'block';
      document.getElementById('call-overlay').style.transform = 'translateY(0)';
    }

    function abortPairing(stopStream = true) {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().catch(() => {});
        html5QrcodeScanner = null;
      }

      document.getElementById('qr-pairing-modal').style.display = 'none';

      if (stopStream && localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
    }

    function endCall() {
      location.reload();
    }

    function toggleMic() {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        audioTrack.enabled = !audioTrack.enabled;
        document.getElementById('btn-mic').innerText = audioTrack.enabled ? "🎙️" : "🔇";
      }
    }

    function toggleVideo() {
      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        videoTrack.enabled = !videoTrack.enabled;
        document.getElementById('btn-video').innerText = videoTrack.enabled ? "📹" : "🚫";
      }
    }
  </script>
</body>
</html>
