<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FaceTime Web - P2P Serverless Connect</title>
  <style>
    /* 原生 Apple 風格響應式 CSS 樣式表 - 100% 離線可用 */
    :root {
      --sat: env(safe-area-inset-top);
      --sab: env(safe-area-inset-bottom);
      --apple-green: #30D158;
      --apple-red: #FF453A;
      --apple-dark: #1C1C1E;
      --apple-gray: #2C2C2E;
      --apple-light-gray: #3A3A3C;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      height: 100%;
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overscroll-behavior: none;
    }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .hidden { display: none !important; }
    .fixed { position: fixed; }
    .absolute { position: absolute; }
    .inset-0 { top: 0; left: 0; right: 0; bottom: 0; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .object-cover { object-fit: cover; }
    .blur-bg {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .mirror-view { transform: scaleX(-1); }
    
    /* 主面板 */
    #setup-panel {
      background-color: rgba(0, 0, 0, 0.85);
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .panel-container {
      width: 100%;
      max-width: 420px;
      margin: auto;
    }
    .app-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .logo-box {
      width: 40px;
      height: 40px;
      background-color: var(--apple-green);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(48, 209, 88, 0.4);
    }
    .logo-text {
      font-size: 1.25rem;
      font-weight: 600;
      margin-left: 10px;
    }
    .badge {
      background-color: rgba(48, 209, 88, 0.2);
      color: var(--apple-green);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 700;
      margin-left: 6px;
    }
    
    /* 按鈕 */
    .apple-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .apple-btn:active { transform: scale(0.97); }
    .btn-green { background-color: var(--apple-green); color: #000000; }
    .btn-green:hover { background-color: #2bc050; }
    .btn-gray { background-color: var(--apple-light-gray); color: #ffffff; }
    .btn-gray:hover { background-color: #4a4a4c; }
    .btn-red { background-color: var(--apple-red); color: #ffffff; }
    
    /* 卡片與容器 */
    .card {
      background-color: var(--apple-gray);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 16px;
    }
    .text-muted { color: #a1a1a6; font-size: 0.85rem; line-height: 1.5; text-align: center; }
    
    /* 二維碼對接介面 (Dual-Scan) */
    #qr-pairing-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: #000000;
      display: none;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    .scan-half {
      flex: 1.1;
      position: relative;
      background-color: #050505;
      overflow: hidden;
      border-bottom: 2px solid var(--apple-light-gray);
    }
    .qr-half {
      flex: 0.9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      padding: 16px;
      gap: 16px;
    }
    .qr-container {
      width: 190px;
      height: 190px;
      background-color: #ffffff;
      padding: 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #reader {
      width: 100%;
      height: 100%;
    }
    .scan-target-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border: 3px solid var(--apple-green);
      border-radius: 24px;
      box-shadow: 0 0 0 4000px rgba(0,0,0,0.65);
      pointer-events: none;
    }
    .pairing-progress {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--apple-green);
      text-align: center;
      letter-spacing: 0.5px;
    }
    
    /* 視訊視窗 */
    #local-video-container {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 110px;
      height: 165px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: none;
    }
    
    /* 通話進行中控制列 */
    #call-overlay {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 24px;
      padding-bottom: max(2rem, var(--sab));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .control-bar {
      background-color: rgba(30, 30, 32, 0.9);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 16px 24px;
      border-radius: 40px;
      display: flex;
      gap: 20px;
      pointer-events: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
    }
    .round-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background-color: var(--apple-light-gray);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      font-size: 1.3rem;
      transition: background-color 0.2s;
    }
    .round-btn:active { transform: scale(0.92); }
    .round-btn-red { background-color: var(--apple-red); }
    .round-btn-red:hover { background-color: #ff3b30; }
  </style>

  <!-- ================= INLINE DEPENDENCIES (完全離線本地支持) ================= -->
  <script>
    /**
     * FaceTimeQR - 命名空間隔離、無變量衝突嘅標準二維碼產生引擎。
     * 支持自適應 Version 1 至 40，並使用 L 級低點陣容錯率最大化傳輸容量。
     */
    const FaceTimeQR = (function() {
      const MAX_VERSION = 40;
      const ErrorCorrectLevel = { L: 1, M: 0, Q: 3, H: 2 };
      
      const LIMIT_TABLE = [
        [17,14,11,7],[34,26,15,10],[58,40,26,15],[82,56,36,20],[106,74,48,26],
        [139,108,64,30],[154,124,84,35],[194,154,99,40],[242,180,119,45],[295,216,137,50],
        [341,250,162,60],[413,296,186,66],[470,352,224,70],[528,376,254,80],[614,444,298,88],
        [680,480,313,99],[754,539,341,111],[842,593,385,121],[940,642,406,132],[1048,721,442,143],
        [1142,795,464,154],[1246,861,513,172],[1354,952,535,180],[1474,1034,589,196],[1583,1121,625,214],
        [1721,1201,673,230],[1837,1277,721,244],[2009,1383,769,265],[2141,1461,811,280],[2301,1529,871,300],
        [2461,1681,911,324],[2631,1773,981,350],[2821,1861,1051,376],[3011,2013,1131,402],[3221,2085,1201,426],
        [3431,2181,1271,450],[3651,2301,1371,480],[3881,2431,1431,510],[4121,2531,1511,540],[4361,2651,1611,570]
      ];

      function QR8bitByte(data) {
        this.mode = 4; // 8-bit byte mode
        this.data = data;
        this.parsedData = [];
        for (let i = 0; i < this.data.length; i++) {
          let charCode = this.data.charCodeAt(i);
          if (charCode > 65536) {
            this.parsedData.push(240 | ((charCode >>> 18) & 7));
            this.parsedData.push(128 | ((charCode >>> 12) & 63));
            this.parsedData.push(128 | ((charCode >>> 6) & 63));
            this.parsedData.push(128 | (charCode & 63));
          } else if (charCode > 2048) {
            this.parsedData.push(224 | ((charCode >>> 12) & 15));
            this.parsedData.push(128 | ((charCode >>> 6) & 63));
            this.parsedData.push(128 | (charCode & 63));
          } else if (charCode > 127) {
            this.parsedData.push(192 | ((charCode >>> 6) & 31));
            this.parsedData.push(128 | (charCode & 63));
          } else {
            this.parsedData.push(charCode);
          }
        }
      }

      QR8bitByte.prototype = {
        getLength: function() { return this.parsedData.length; },
        write: function(buffer) {
          for (let i = 0; i < this.parsedData.length; i++) {
            buffer.put(this.parsedData[i], 8);
          }
        }
      };

      function QRBitBuffer() {
        this.buffer = [];
        this.length = 0;
      }

      QRBitBuffer.prototype = {
        get: function(index) {
          let bufIndex = Math.floor(index / 8);
          return ((this.buffer[bufIndex] >>> (7 - (index % 8))) & 1) === 1;
        },
        put: function(num, length) {
          for (let i = 0; i < length; i++) {
            this.putBit(((num >>> (length - i - 1)) & 1) === 1);
          }
        },
        getLengthInBits: function() { return this.length; },
        putBit: function(bit) {
          let bufIndex = Math.floor(this.length / 8);
          if (this.buffer.length <= bufIndex) {
            this.buffer.push(0);
          }
          if (bit) {
            this.buffer[bufIndex] |= (128 >>> (this.length % 8));
          }
          this.length++;
        }
      };

      function QRPolynomial(num, shift) {
        if (num.length === undefined) {
          throw new Error(num.length + "/" + shift);
        }
        let offset = 0;
        while (offset < num.length && num[offset] === 0) {
          offset++;
        }
        this.num = new Array(num.length - offset + shift);
        for (let i = 0; i < num.length - offset; i++) {
          this.num[i] = num[offset + i];
        }
        for (let i = num.length - offset; i < this.num.length; i++) {
          this.num[i] = 0;
        }
      }

      QRPolynomial.prototype = {
        getAt: function(index) { return this.num[index]; },
        getLength: function() { return this.num.length; },
        multiply: function(e) {
          let numData = new Array(this.getLength() + e.getLength() - 1);
          for (let i = 0; i < this.getLength(); i++) {
            for (let j = 0; j < e.getLength(); j++) {
              numData[i + j] ^= QRMath.gmul(this.getAt(i), e.getAt(j));
            }
          }
          return new QRPolynomial(numData, 0);
        },
        mod: function(e) {
          if (this.getLength() - e.getLength() < 0) {
            return this;
          }
          let ratio = QRMath.glog(this.getAt(0)) - QRMath.glog(e.getAt(0));
          let numData = new Array(this.getLength());
          for (let i = 0; i < this.getLength(); i++) {
            numData[i] = this.getAt(i);
          }
          for (let i = 0; i < e.getLength(); i++) {
            numData[i] ^= QRMath.gmul(e.getAt(i), QRMath.gexp(ratio));
          }
          return new QRPolynomial(numData, 0).mod(e);
        }
      };

      const QRMath = {
        glog: function(n) {
          if (n < 1) throw new Error("glog(" + n + ")");
          return LOG_TABLE[n];
        },
        gexp: function(n) {
          while (n < 0) n += 255;
          while (n >= 255) n -= 255;
          return EXP_TABLE[n];
        },
        gmul: function(n1, n2) {
          if (n1 === 0 || n2 === 0) return 0;
          return EXP_TABLE[LOG_TABLE[n1] + LOG_TABLE[n2]];
        }
      };

      const EXP_TABLE = new Array(256);
      const LOG_TABLE = new Array(256);
      for (let i = 0; i < 8; i++) EXP_TABLE[i] = 1 << i;
      for (let i = 8; i < 256; i++) EXP_TABLE[i] = EXP_TABLE[i - 4] ^ EXP_TABLE[i - 3] ^ EXP_TABLE[i - 2] ^ EXP_TABLE[i];
      for (let i = 0; i < 255; i++) LOG_TABLE[EXP_TABLE[i]] = i;

      function QRRSBlock(totalCount, dataCount) {
        this.totalCount = totalCount;
        this.dataCount = dataCount;
      }

      QRRSBlock.getRSBlocks = function(version, ecLevel) {
        let list = [];
        let table = QRRSBlock.getRsBlockTable(version, ecLevel);
        if (table === undefined) {
          throw new Error("bad rs block @ version:" + version + "/ecLevel:" + ecLevel);
        }
        let count = table.length / 3;
        for (let i = 0; i < count; i++) {
          let num = table[3 * i];
          let total = table[3 * i + 1];
          let data = table[3 * i + 2];
          for (let j = 0; j < num; j++) {
            list.push(new QRRSBlock(total, data));
          }
        }
        return list;
      };

      QRRSBlock.getRsBlockTable = function(version, ecLevel) {
        switch (ecLevel) {
          case ErrorCorrectLevel.L: return LIMIT_TABLE[version - 1][0];
          case ErrorCorrectLevel.M: return LIMIT_TABLE[version - 1][1];
          case ErrorCorrectLevel.Q: return LIMIT_TABLE[version - 1][2];
          case ErrorCorrectLevel.H: return LIMIT_TABLE[version - 1][3];
          default: return undefined;
        }
      };

      QRRSBlock.getGQP = function(dataBytes, errorCount) {
        let poly = new QRPolynomial([1], 0);
        for (let i = 0; i < errorCount; i++) {
          poly = poly.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
        }
        let dataPoly = new QRPolynomial(dataBytes, poly.getLength() - 1);
        let modPoly = dataPoly.mod(poly);
        let count = poly.getLength() - 1;
        let result = new Array(count);
        for (let i = 0; i < count; i++) {
          let modIndex = i + modPoly.getLength() - count;
          result[i] = (modIndex >= 0) ? modPoly.getAt(modIndex) : 0;
        }
        return result;
      };

      // 核心主類別
      function QRCodeModel(version, ecLevel) {
        this.typeNumber = version;
        this.errorCorrectLevel = ecLevel;
        this.modules = null;
        this.moduleCount = 0;
        this.dataCache = null;
        this.dataList = [];
      }

      QRCodeModel.prototype = {
        addData: function(data) {
          this.dataList.push(new QR8bitByte(data));
          this.dataCache = null;
        },
        isDark: function(row, col) {
          if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
            return false;
          }
          return this.modules[row][col];
        },
        getModuleCount: function() { return this.moduleCount; },
        make: function() {
          this.moduleCount = 4 * this.typeNumber + 17;
          this.modules = new Array(this.moduleCount);
          for (let i = 0; i < this.moduleCount; i++) {
            this.modules[i] = new Array(this.moduleCount).fill(null);
          }
          this.setupPositionProbePattern(0, 0);
          this.setupPositionProbePattern(this.moduleCount - 7, 0);
          this.setupPositionProbePattern(0, this.moduleCount - 7);
          this.setupPositionAdjustPattern();
          this.setupTimingPattern();
          this.setupTypeInfo(false, 0);
          if (this.typeNumber > 6) {
            this.setupTypeNumber(false);
          }
          if (this.dataCache === null) {
            this.dataCache = QRCodeModel.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
          }
          this.mapData(this.dataCache, 0);
        },
        setupPositionProbePattern: function(row, col) {
          for (let r = -1; r <= 7; r++) {
            if (row + r < -1 || this.moduleCount <= row + r) continue;
            for (let c = -1; c <= 7; c++) {
              if (col + c < -1 || this.moduleCount <= col + c) continue;
              if ((0 <= r && r <= 6 && (c === 0 || c === 6)) || 
                  (0 <= c && c <= 6 && (r === 0 || r === 6)) || 
                  (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
                this.modules[row + r][col + c] = true;
              } else {
                this.modules[row + r][col + c] = false;
              }
            }
          }
        },
        setupTimingPattern: function() {
          for (let r = 8; r < this.moduleCount - 8; r++) {
            if (this.modules[r][6] !== null) continue;
            this.modules[r][6] = (r % 2 === 0);
          }
          for (let c = 8; c < this.moduleCount - 8; c++) {
            if (this.modules[6][c] !== null) continue;
            this.modules[6][c] = (c % 2 === 0);
          }
        },
        setupPositionAdjustPattern: function() {
          let pos = QRUtil.getPatternPosition(this.typeNumber);
          for (let i = 0; i < pos.length; i++) {
            for (let j = 0; j < pos.length; j++) {
              let r = pos[i];
              let c = pos[j];
              if (this.modules[r][c] !== null) continue;
              for (let dr = -2; dr <= 2; dr++) {
                for (let dc = -2; dc <= 2; dc++) {
                  if (Math.abs(dr) === 2 || Math.abs(dc) === 2 || (dr === 0 && dc === 0)) {
                    this.modules[r + dr][c + dc] = true;
                  } else {
                    this.modules[r + dr][c + dc] = false;
                  }
                }
              }
            }
          }
        },
        setupTypeNumber: function(test) {
          let bits = QRUtil.getBCHTypeNumber(this.typeNumber);
          for (let i = 0; i < 18; i++) {
            let mod = (!test && ((bits >>> i) & 1) === 1);
            this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
            this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
          }
        },
        setupTypeInfo: function(test, maskPattern) {
          let data = (this.errorCorrectLevel << 3) | maskPattern;
          let bits = QRUtil.getBCHTypeInfo(data);
          for (let i = 0; i < 15; i++) {
            let mod = (!test && ((bits >>> i) & 1) === 1);
            if (i < 6) {
              this.modules[i][8] = mod;
            } else if (i < 8) {
              this.modules[i + 1][8] = mod;
            } else {
              this.modules[this.moduleCount - 15 + i][8] = mod;
            }
            if (i < 8) {
              this.modules[8][this.moduleCount - i - 1] = mod;
            } else if (i < 9) {
              this.modules[8][15 - i - 1 + 1] = mod;
            } else {
              this.modules[8][15 - i - 1] = mod;
            }
          }
          this.modules[this.moduleCount - 8][8] = !test;
        },
        mapData: function(data, maskPattern) {
          let inc = -1;
          let row = this.moduleCount - 1;
          let bitIndex = 7;
          let byteIndex = 0;
          for (let col = this.moduleCount - 1; col > 0; col -= 2) {
            if (col === 6) col--;
            while (true) {
              for (let c = 0; c < 2; c++) {
                let targetCol = col - c;
                if (this.modules[row][targetCol] === null) {
                  let dark = false;
                  if (byteIndex < data.length) {
                    dark = (((data[byteIndex] >>> bitIndex) & 1) === 1);
                  }
                  let mask = QRUtil.getMask(row, targetCol, maskPattern);
                  if (mask) {
                    dark = !dark;
                  }
                  this.modules[row][targetCol] = dark;
                  bitIndex--;
                  if (bitIndex === -1) {
                    byteIndex++;
                    bitIndex = 7;
                  }
                }
              }
              row += inc;
              if (row < 0 || this.moduleCount <= row) {
                row -= inc;
                inc = -inc;
                break;
              }
            }
          }
        }
      };

      QRCodeModel.createData = function(version, ecLevel, dataList) {
        let rsBlocks = QRRSBlock.getRSBlocks(version, ecLevel);
        let buffer = new QRBitBuffer();
        for (let i = 0; i < dataList.length; i++) {
          let data = dataList[i];
          buffer.put(data.mode, 4);
          buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, version));
          data.write(buffer);
        }
        let totalDataCount = 0;
        for (let i = 0; i < rsBlocks.length; i++) {
          totalDataCount += rsBlocks[i].dataCount;
        }
        if (buffer.getLengthInBits() > totalDataCount * 8) {
          throw new Error("數據容量溢出! (" + buffer.getLengthInBits() + " > " + (totalDataCount * 8) + ")");
        }
        if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
          buffer.put(0, 4);
        }
        while (buffer.getLengthInBits() % 8 !== 0) {
          buffer.putBit(false);
        }
        while (true) {
          if (buffer.getLengthInBits() >= totalDataCount * 8) break;
          buffer.put(118, 8); // pad
          if (buffer.getLengthInBits() >= totalDataCount * 8) break;
          buffer.put(237, 8); // pad
        }
        return QRCodeModel.createBytes(buffer, rsBlocks);
      };

      QRCodeModel.createBytes = function(buffer, rsBlocks) {
        let offset = 0;
        let maxDcCount = 0;
        let maxEcCount = 0;
        let dcBytes = new Array(rsBlocks.length);
        let ecBytes = new Array(rsBlocks.length);
        for (let r = 0; r < rsBlocks.length; r++) {
          let dcCount = rsBlocks[r].dataCount;
          let ecCount = rsBlocks[r].totalCount - dcCount;
          maxDcCount = Math.max(maxDcCount, dcCount);
          maxEcCount = Math.max(maxEcCount, ecCount);
          dcBytes[r] = new Array(dcCount);
          for (let i = 0; i < dcBytes[r].length; i++) {
            dcBytes[r][i] = 0xff & buffer.buffer[i + offset];
          }
          offset += dcCount;
          let rsPoly = QRRSBlock.getGQP(dcBytes[r], ecCount);
          ecBytes[r] = new Array(rsPoly.length);
          for (let i = 0; i < ecBytes[r].length; i++) {
            ecBytes[r][i] = rsPoly[i];
          }
        }
        let totalSize = 0;
        for (let i = 0; i < rsBlocks.length; i++) {
          totalSize += rsBlocks[i].totalCount;
        }
        let data = new Array(totalSize);
        let index = 0;
        for (let i = 0; i < maxDcCount; i++) {
          for (let r = 0; r < rsBlocks.length; r++) {
            if (i < dcBytes[r].length) {
              data[index++] = dcBytes[r][i];
            }
          }
        }
        for (let i = 0; i < maxEcCount; i++) {
          for (let r = 0; r < rsBlocks.length; r++) {
            if (i < ecBytes[r].length) {
              data[index++] = ecBytes[r][i];
            }
          }
        }
        return data;
      };

      const QRUtil = {
        PATTERN_POSITION_TABLE: [
          [],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],
          [6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70],[6,26,50,74],[6,30,54,78],
          [6,30,56,82],[6,30,58,86],[6,34,62,90],[6,28,50,72,94],[6,26,50,74,98],[6,30,54,78,102],
          [6,28,54,80,106],[6,32,58,84,110],[6,30,58,86,114],[6,34,62,90,118],[6,26,50,74,98,122],
          [6,30,54,78,102,126],[6,26,52,78,104,130],[6,30,56,82,108,134],[6,34,60,86,112,138],
          [6,30,58,86,114,142],[6,34,62,90,118,146],[6,30,54,78,102,126,150],[6,24,50,76,102,128,154],
          [6,28,54,80,106,132,158],[6,32,58,84,110,136,162],[6,26,54,82,110,138,166],[6,30,58,86,114,142,170]
        ],
        G15: 1335,
        G18: 7973,
        G15_MASK: 21522,
        getBCHTypeInfo: function(data) {
          let r = data << 10;
          while (QRUtil.getBCHDigit(r) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            r ^= (QRUtil.G15 << (QRUtil.getBCHDigit(r) - QRUtil.getBCHDigit(QRUtil.G15)));
          }
          return ((data << 10) | r) ^ QRUtil.G15_MASK;
        },
        getBCHTypeNumber: function(data) {
          let r = data << 12;
          while (QRUtil.getBCHDigit(r) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            r ^= (QRUtil.G18 << (QRUtil.getBCHDigit(r) - QRUtil.getBCHDigit(QRUtil.G18)));
          }
          return (data << 12) | r;
        },
        getBCHDigit: function(data) {
          let digit = 0;
          while (data !== 0) {
            digit++;
            data >>>= 1;
          }
          return digit;
        },
        getPatternPosition: function(version) {
          return QRUtil.PATTERN_POSITION_TABLE[version - 1];
        },
        getMask: function(row, col, pattern) {
          switch (pattern) {
            case 0: return (row + col) % 2 === 0;
            case 1: return row % 2 === 0;
            case 2: return col % 3 === 0;
            case 3: return (row + col) % 3 === 0;
            case 4: return (Math.floor(row / 2) + Math.floor(col / 3)) % 2 === 0;
            case 5: return (row * col) % 2 + (row * col) % 3 === 0;
            case 6: return ((row * col) % 2 + (row * col) % 3) % 2 === 0;
            case 7: return ((row * col) % 3 + (row + col) % 2) % 2 === 0;
            default: throw new Error("bad maskPattern:" + pattern);
          }
        },
        getLengthInBits: function(mode, version) {
          if (1 <= version && version < 10) {
            return 8; // Mode 8-bit Byte
          } else if (version < 27) {
            return 16;
          } else if (version <= 40) {
            return 16;
          }
          return 16;
        }
      };

      // 繪圖接口
      function Generator(elementId, options) {
        this.element = typeof elementId === "string" ? document.getElementById(elementId) : elementId;
        this.options = {
          width: 256,
          height: 256,
          correctLevel: ErrorCorrectLevel.L,
          colorDark: "#000000",
          colorLight: "#ffffff"
        };
        if (options) {
          Object.assign(this.options, options);
        }
      }

      Generator.prototype.makeCode = function(text) {
        // 自適應容量選擇
        let version = 1;
        let textLen = text.length;
        for (let i = 0; i < LIMIT_TABLE.length; i++) {
          let limit = LIMIT_TABLE[i][0]; // L 級容量
          if (limit >= textLen) {
            version = i + 1;
            break;
          }
        }
        if (version > MAX_VERSION) version = MAX_VERSION;

        let model = new QRCodeModel(version, this.options.correctLevel);
        model.addData(text);
        model.make();

        let canvas = document.createElement("canvas");
        canvas.width = this.options.width;
        canvas.height = this.options.height;
        let ctx = canvas.getContext("2d");

        let moduleSizeWidth = this.options.width / model.getModuleCount();
        let moduleSizeHeight = this.options.height / model.getModuleCount();

        for (let r = 0; r < model.getModuleCount(); r++) {
          for (let c = 0; c < model.getModuleCount(); c++) {
            ctx.fillStyle = model.isDark(r, c) ? this.options.colorDark : this.options.colorLight;
            let x = Math.round(c * moduleSizeWidth);
            let y = Math.round(r * moduleSizeHeight);
            ctx.fillRect(x, y, Math.ceil((c + 1) * moduleSizeWidth) - x, Math.ceil((r + 1) * moduleSizeHeight) - y);
          }
        }

        this.element.innerHTML = "";
        this.element.appendChild(canvas);
      };

      return {
        Generator: Generator,
        CorrectLevel: ErrorCorrectLevel
      };
    })();
  </script>

  <!-- 2. html5-qrcode.min.js (高效率本地相機解析模組) -->
  <script src="https://unpkg.com/html5-qrcode" crossorigin="anonymous"></script>
</head>
<body class="flex flex-col justify-between">

  <!-- Toast 訊息容器 -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[110] w-11/12 max-w-sm pointer-events-none"></div>

  <!-- 背景遠端影片區 (通話中顯示) -->
  <div class="fixed inset-0 z-0 bg-black w-full h-full">
    <video id="remote-video" class="w-full h-full object-cover" autoplay playsinline></video>
    <div id="video-placeholder" class="fixed inset-0 flex flex-col items-center justify-center bg-zinc-950 text-zinc-500 transition-opacity duration-500 z-[1]">
      <span class="text-sm font-medium">等待影片串流...</span>
    </div>
  </div>

  <!-- 浮動本地影片預覽 (通話中子畫面) -->
  <div id="local-video-container" class="z-30">
    <video id="local-video" class="w-full h-full object-cover mirror-view" autoplay playsinline muted></video>
  </div>

  <!-- ================= 主設置面板 ================= -->
  <div id="setup-panel" class="fixed inset-0 z-20">
    <div class="panel-container">
      
      <!-- 標題列 -->
      <div class="app-title-bar">
        <div class="flex items-center">
          <div class="logo-box">
            <!-- 內置 SVG 圖標 - 100% 離線可用 -->
            <svg class="w-5 h-5 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M23 7l-7 5 7 5V7z"/>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
          </div>
          <span class="logo-text">FaceTime <span class="badge">無網 P2P 版</span></span>
        </div>
      </div>

      <!-- 操作區卡片 -->
      <div class="card flex flex-col gap-4">
        <p class="text-muted">本網頁完全在本地瀏覽器運行。雙方連線至同一個實體 Wi-Fi 網絡，點擊下方角色按鈕並互相對準掃描二維碼，即可進行高畫質視訊連線。</p>
        
        <div class="flex gap-2">
          <button id="btn-caller" onclick="startPairingFlow('caller')" class="apple-btn btn-green flex-1">我是發起方</button>
          <button id="btn-receiver" onclick="startPairingFlow('receiver')" class="apple-btn btn-gray flex-1">我是接聽方</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= 二維碼雙向對接彈窗 (z-100) ================= -->
  <div id="qr-pairing-modal">
    <!-- 上半部：鏡頭掃描器 -->
    <div class="scan-half">
      <div id="reader"></div>
      <div class="scan-target-box"></div>
    </div>
    
    <!-- 下半部：本機 SDP 二維碼 -->
    <div class="qr-half">
      <div class="pairing-progress" id="pairing-status">正在啟用相機與生成對接代碼...</div>
      <div class="qr-container" id="qr-target"></div>
      <button onclick="abortPairing()" class="apple-btn btn-red" style="max-width: 180px;">取消配對</button>
    </div>
  </div>

  <!-- ================= 通話控制列 ================= -->
  <div id="call-overlay">
    <div class="control-bar">
      <button onclick="toggleMic()" class="round-btn" id="btn-mic">🎙️</button>
      <button onclick="toggleVideo()" class="round-btn" id="btn-video">📹</button>
      <button onclick="endCall()" class="round-btn round-btn-red">📞</button>
    </div>
  </div>

  <!-- ================= 核心對接與 SDP 壓縮、掃描與連接邏輯 ================= -->
  <script>
    let peerConnection = null;
    let localStream = null;
    let remoteStream = null;
    let activeRole = null;
    let qrcodeGeneratorInstance = null;
    let html5QrcodeScanner = null;
    
    // 二維碼輪播變數
    let qrCarouselInterval = null;
    let currentQrIndex = 0;
    let myChunks = [];

    // 接收緩衝區
    let receivedChunks = {};
    let totalChunksNeeded = 0;

    // WebRTC 局域網完全離線設定 (不使用外網 STUN/TURN 伺服器)
    const rtcConfig = { iceServers: [] };

    // ==========================================
    // 100% 離線高效率 LZW 字典壓縮與 16-bit 數據打包演算法
    // 將 ~3000 字元的原始 SDP 精簡壓縮 65% 以上
    // ==========================================
    const sdpDictionary = [
      ["a=candidate:", "C:"],
      ["a=fingerprint:sha-256 ", "F:"],
      ["a=setup:", "S:"],
      ["a=ice-ufrag:", "U:"],
      ["a=ice-pwd:", "P:"],
      ["a=mid:", "M:"],
      ["a=rtpmap:", "R:"],
      ["a=fmtp:", "E:"],
      ["a=ssrc:", "X:"],
      ["c=IN IP4 ", "I:"],
      ["typ host", "H"],
      ["typ srflx", "W"],
      ["typ relay", "Y"],
      ["\r\n", "\n"]
    ];

    function filterAndCompressSDP(sdp) {
      let compressed = sdp;
      // 1. 過濾不必要之 SDP 描述行
      const lines = sdp.split("\r\n");
      const filteredLines = lines.filter(line => {
        if (line.includes("a=rtcp-fb:")) return false;
        if (line.includes("a=extmap:")) return false;
        if (line.includes("a=msid:")) return false;
        if (line.includes("a=ssrc-group:")) return false;
        if (line.includes("::")) return false; // 移除 IPv6 
        return true;
      });
      compressed = filteredLines.join("\r\n");

      // 2. 執行字典替換
      for (let item of sdpDictionary) {
        compressed = compressed.split(item[0]).join(item[1]);
      }

      // 3. 執行高效 LZW 編碼
      return lzwEncode(compressed);
    }

    function decompressAndRestoreSDP(compressed) {
      // 1. 執行 LZW 解碼
      let decompressed = lzwDecode(compressed);

      // 2. 還原字典替換
      for (let item of sdpDictionary) {
        decompressed = decompressed.split(item[1]).join(item[0]);
      }
      return decompressed;
    }

    // LZW 編碼實施
    function lzwEncode(uncompressedString) {
      let dictionary = {};
      let data = (uncompressedString + "").split("");
      let outCodes = [];
      let currentChar;
      let phrase = data[0];
      let codeCount = 256;
      for (let i = 1; i < data.length; i++) {
        currentChar = data[i];
        if (dictionary[phrase + currentChar] != null) {
          phrase += currentChar;
        } else {
          outCodes.push(phrase.length > 1 ? dictionary[phrase] : phrase.charCodeAt(0));
          dictionary[phrase + currentChar] = codeCount;
          codeCount++;
          phrase = currentChar;
        }
      }
      outCodes.push(phrase.length > 1 ? dictionary[phrase] : phrase.charCodeAt(0));
      return codesToBase64(outCodes);
    }

    // LZW 解碼實施
    function lzwDecode(base64Data) {
      let codes = base64ToCodes(base64Data);
      if (codes.length === 0) return "";
      let dictionary = {};
      let currentChar = String.fromCharCode(codes[0]);
      let oldPhrase = currentChar;
      let outString = [currentChar];
      let codeCount = 256;
      let phrase;
      for (let i = 1; i < codes.length; i++) {
        let currCode = codes[i];
        if (currCode < 256) {
          phrase = String.fromCharCode(currCode);
        } else {
          phrase = dictionary[currCode] ? dictionary[currCode] : (oldPhrase + currentChar);
        }
        outString.push(phrase);
        currentChar = phrase.charAt(0);
        dictionary[codeCount] = oldPhrase + currentChar;
        codeCount++;
        oldPhrase = phrase;
      }
      return outString.join("");
    }

    // 16-bit 數據壓縮位元組打包
    function codesToBase64(codes) {
      let binaryString = "";
      for (let i = 0; i < codes.length; i++) {
        binaryString += String.fromCharCode(codes[i] & 0xFF, (codes[i] >> 8) & 0xFF);
      }
      return btoa(binaryString);
    }

    function base64ToCodes(b64) {
      try {
        let binaryString = atob(b64);
        let codes = [];
        for (let i = 0; i < binaryString.length; i += 2) {
          let low = binaryString.charCodeAt(i);
          let high = binaryString.charCodeAt(i + 1);
          codes.push(low | (high << 8));
        }
        return codes;
      } catch (e) {
        console.error("Base64解碼數據損壞: ", e);
        return [];
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      // 100% 成功初始化新版 QR 碼引擎
      try {
        qrcodeGeneratorInstance = new FaceTimeQR.Generator("qr-target", {
          width: 170,
          height: 170,
          correctLevel: FaceTimeQR.CorrectLevel.L
        });
      } catch (e) {
        console.error("QRCode 引擎初始化失敗: ", e);
      }
    });

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.style.cssText = "background: rgba(30,30,30,0.95); border: 1px solid rgba(255,255,255,0.1); padding: 14px 20px; border-radius: 14px; margin-bottom: 10px; font-size: 13px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.4); pointer-events: auto;";
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    async function startPairingFlow(role) {
      activeRole = role;
      document.getElementById('qr-pairing-modal').style.display = 'flex';
      
      // 1. 啟用本地視訊音軌
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
        document.getElementById('local-video').srcObject = localStream;
      } catch (err) {
        showToast("相機啟用失敗: " + err.message);
        abortPairing();
        return;
      }

      // 2. 初始化實體 RTC 通道
      initPeerConnection();

      // 3. 按角色生成並輪播 SDP 數據
      if (role === 'caller') {
        try {
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          
          // 等待網卡收集完畢本地 IP 端點
          setTimeout(async () => {
            let compressedOffer = filterAndCompressSDP(peerConnection.localDescription.sdp);
            prepareAndCarouselSDP(compressedOffer);
          }, 800);
        } catch (e) {
          showToast("SDP 生成失敗: " + e.message);
        }
      } else {
        document.getElementById('pairing-status').innerText = "請對準發起方的二維碼進行掃描...";
      }

      // 4. 啟動鏡頭讀取
      startCameraScanner();
    }

    function initPeerConnection() {
      if (peerConnection) peerConnection.close();
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteStream = event.streams[0];
          document.getElementById('remote-video').srcObject = remoteStream;
          transitionToCallActive();
        }
      };

      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }
    }

    // 數據片斷分切與動態輪播實施
    function prepareAndCarouselSDP(compressedSdpData) {
      clearInterval(qrCarouselInterval);
      
      // 每段數據切片長度為 120 字元，降低單個 QR Code 的點陣密度以提速識別
      const chunkSize = 120;
      myChunks = [];
      const total = Math.ceil(compressedSdpData.length / chunkSize);
      for (let i = 0; i < total; i++) {
        myChunks.push(`${i + 1}/${total}_${compressedSdpData.substr(i * chunkSize, chunkSize)}`);
      }

      // 啟動 250ms 間隔的無縫動態輪播
      currentQrIndex = 0;
      qrCarouselInterval = setInterval(() => {
        if (myChunks.length === 0) return;
        try {
          qrcodeGeneratorInstance.makeCode(myChunks[currentQrIndex]);
          document.getElementById('pairing-status').innerText = `本地對接代碼傳輸中 (${currentQrIndex + 1}/${myChunks.length})`;
          currentQrIndex = (currentQrIndex + 1) % myChunks.length;
        } catch (e) {
          console.error("生成二維碼錯誤: ", e);
        }
      }, 250);
    }

    // 啟動本地高幀率解碼器
    function startCameraScanner() {
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: 220 },
        onQrCodeScanned,
        () => {} // 靜默未解碼幀
      ).catch(err => {
        showToast("相機掃描器載入失敗: " + err);
      });
    }

    // 拼接與接收動態輪播分段
    async function onQrCodeScanned(decodedText) {
      const match = decodedText.match(/^(\d+)\/(\d+)_(.+)$/);
      if (!match) return;

      const idx = parseInt(match[1]);
      const total = parseInt(match[2]);
      const payload = match[3];

      if (totalChunksNeeded === 0) {
        totalChunksNeeded = total;
      }

      if (!receivedChunks[idx]) {
        receivedChunks[idx] = payload;
        const currentCount = Object.keys(receivedChunks).length;
        showToast(`已解鎖對方數據片斷: ${currentCount}/${total}`);

        if (currentCount === totalChunksNeeded) {
          if (html5QrcodeScanner) {
            await html5QrcodeScanner.stop();
          }
          reconstructAndApplySDP();
        }
      }
    }

    // 重組並實施連通
    async function reconstructAndApplySDP() {
      try {
        let base64String = "";
        for (let i = 1; i <= totalChunksNeeded; i++) {
          base64String += receivedChunks[i];
        }

        // 字典解壓與格式還原
        const decompressedSdp = decompressAndRestoreSDP(base64String);

        if (activeRole === 'caller') {
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: decompressedSdp }));
          showToast("雙向連線握手成功，正在建立視訊通道...");
        } else {
          await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: decompressedSdp }));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          
          // 重置本機接收緩衝
          receivedChunks = {};
          totalChunksNeeded = 0;
          
          // 啟動本機 Answer 的輪播
          let compressedAnswer = filterAndCompressSDP(peerConnection.localDescription.sdp);
          prepareAndCarouselSDP(compressedAnswer);
          
          showToast("發起端數據解鎖完成！請對準本機螢幕，讓發起端掃描下方代碼...");
          startCameraScanner(); // 重新啟動掃描以偵測發起端完成對接
        }
      } catch (err) {
        showToast("代碼重組或 WebRTC 通道寫入失敗: " + err.message);
        abortPairing();
      }
    }

    function transitionToCallActive() {
      abortPairing(false);
      document.getElementById('setup-panel').style.display = 'none';
      document.getElementById('local-video-container').style.display = 'block';
      document.getElementById('call-overlay').style.transform = 'translateY(0)';
    }

    function abortPairing(stopStream = true) {
      clearInterval(qrCarouselInterval);
      qrCarouselInterval = null;
      receivedChunks = {};
      totalChunksNeeded = 0;

      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().catch(() => {});
        html5QrcodeScanner = null;
      }

      document.getElementById('qr-pairing-modal').style.display = 'none';

      if (stopStream && localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
    }

    function endCall() {
      location.reload();
    }

    function toggleMic() {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        audioTrack.enabled = !audioTrack.enabled;
        document.getElementById('btn-mic').innerText = audioTrack.enabled ? "🎙️" : "🔇";
      }
    }

    function toggleVideo() {
      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        videoTrack.enabled = !videoTrack.enabled;
        document.getElementById('btn-video').innerText = videoTrack.enabled ? "📹" : "🚫";
      }
    }
  </script>
